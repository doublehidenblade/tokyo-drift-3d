<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Strait — Suspension Bridge · 3D Diorama</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}
  #view{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #view:active{cursor:grabbing}
  #hud{position:fixed;top:12px;left:14px;color:#fff;font:13px/1.5 system-ui,sans-serif;
    text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
  #hud b{font-size:15px;letter-spacing:.5px}
  #bar{position:fixed;top:12px;right:14px;z-index:6;display:flex;gap:8px}
  #bar button{background:rgba(20,24,32,.85);color:#fff;border:1px solid #3a4356;border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer}
  #bar button.on{background:#1c3a5e;border-color:#58a6ff}
  #status{position:fixed;bottom:12px;left:14px;color:#9aa4b5;font:12px system-ui,sans-serif;
    text-shadow:0 1px 3px #000;z-index:5}
  #hint{position:fixed;bottom:12px;right:14px;color:#9aa4b5;font:12px system-ui,sans-serif;z-index:5}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><b>Bay Strait — suspension bridge district</b><br><span id="sub">static scene · orbit showroom</span></div>
<div id="bar">
  <button id="btn-day">☀ Day</button>
  <button id="btn-night" class="on">🌙 Night</button>
  <button id="btn-cam">📷 Street view</button>
</div>
<div id="status">loading…</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from './vendor/three.module.js';

const statusEl = document.getElementById('status');
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Neutral preserves shadow detail far better than ACES for night scenes.
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070e);
scene.fog = new THREE.Fog(0x060a16, 80, 340);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 1200);

// ---------- seeded prng ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*f)|0,g=Math.min(255,((n>>8)&255)*f)|0,b=Math.min(255,(n&255)*f)|0;return `rgb(${r},${g},${b})`;}

// ---------- canvas helpers ----------
const CJK = '"Noto Sans CJK JP","Noto Sans CJK",sans-serif';
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function tex(c, srgb=true){ const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
// --- wet-reflection streak (additive) ---
function streakTexture(){
  const [c,g]=cnv(64,256);
  const grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(255,255,255,0.9)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grad; g.fillRect(0,0,64,256);
  const img=g.getImageData(0,0,64,256), d=img.data;
  for(let y=0;y<256;y++) for(let x=0;x<64;x++){
    const f=Math.sin(Math.PI*x/64);
    d[(y*64+x)*4+3]*=f*f;
  }
  g.putImageData(img,0,0);
  return tex(c,false);
}
const streakTex = streakTexture();
// --- soft radial glow (moon halo, sign bleed) ---
const glowTex = (()=>{
  const [c,g]=cnv(128,128);
  const grad=g.createRadialGradient(64,64,4,64,64,64);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.45,'rgba(255,255,255,0.38)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  return tex(c,false);
})();
// --- day/night dimming registry ---
const dimmables=[];
function regDimStd(mat, base){ dimmables.push({ mat, base, std:true }); }
function regDimBasic(mat){ dimmables.push({ mat, base:mat.color.clone(), std:false }); }
function applyDim(night){
  for(const d of dimmables){
    if(d.std) d.mat.emissiveIntensity=d.base*(night?1:0.32);
    else d.mat.color.copy(d.base).multiplyScalar(night?1:0.40);
  }
}
// additive streak lying flat; y = surface height (deck 0.06, water -4.9)
function addStreak(x, z, len, color, opacity, width=2.0, y=0.06){
  const sm=new THREE.MeshBasicMaterial({ map:streakTex, color, transparent:true, opacity,
    blending:THREE.AdditiveBlending, depthWrite:false });
  regDimBasic(sm);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(width,len), sm);
  m.rotation.x=-Math.PI/2; m.rotation.z=Math.PI;
  m.position.set(x,y,z+len/2-0.5);
  scene.add(m);
  return sm; // material handle (for animated beacons)
}
function skyTexture(night){
  const [c,g]=cnv(1024,512);
  const grad=g.createLinearGradient(0,0,0,512);
  if(night){
    grad.addColorStop(0,'#02030a'); grad.addColorStop(0.42,'#0a142c');
    grad.addColorStop(0.60,'#20305c'); grad.addColorStop(0.68,'#7a3a52');
    grad.addColorStop(0.73,'#2c1e30'); grad.addColorStop(1,'#05070c');
  } else {
    grad.addColorStop(0,'#3f7fd0'); grad.addColorStop(0.6,'#9cc6ee');
    grad.addColorStop(0.72,'#e8d9b8'); grad.addColorStop(1,'#b8c4cc');
  }
  g.fillStyle=grad; g.fillRect(0,0,1024,512);
  const rnd=mulberry32(21);
  if(night){
    for(let i=0;i<380;i++){
      const y=rnd()*300, x=rnd()*1024;
      g.fillStyle=`rgba(255,255,255,${0.25+rnd()*0.6})`;
      g.fillRect(x,y,rnd()<0.12?2:1,rnd()<0.12?2:1);
    }
  } else {
    g.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<14;i++){ const x=rnd()*1024,y=40+rnd()*180; g.beginPath(); g.ellipse(x,y,40+rnd()*60,12+rnd()*10,0,0,7); g.fill(); }
  }
  return tex(c);
}
// distant city silhouette with scattered lit windows
function skylineTexture(){
  const [c,g]=cnv(2048,256); const rnd=mulberry32(77);
  g.clearRect(0,0,2048,256);
  let x=0;
  while(x<2048){
    const bw=60+rnd()*130, bh=50+rnd()*150;
    g.fillStyle='#04060c'; g.fillRect(x,256-bh,bw,bh);
    for(let wy=256-bh+8;wy<246;wy+=14) for(let wx=x+6;wx<x+bw-6;wx+=12){
      if(rnd()<0.22){
        g.fillStyle=rnd()<0.75?`rgba(255,${170+rnd()*50|0},110,0.85)`:'rgba(150,190,255,0.8)';
        g.fillRect(wx,wy,5,7);
      }
    }
    if(rnd()<0.35){ g.fillStyle='#ff2a2a'; g.fillRect(x+bw/2-2,256-bh-8,4,4); }
    x+=bw+10+rnd()*60;
  }
  return tex(c);
}
// --- dense Akira-style tower facade (lit density >= 0.6, warm+cool+teal mix) ---
function skylineFacadeTexture(seed, stories, lit){
  const rnd=mulberry32(seed);
  const W=256, rowH=52, H=stories*rowH;
  const [c,g]=cnv(W,H);
  g.fillStyle='#141a28'; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(0,0,0,0.4)'; g.lineWidth=2;
  for(let s=0;s<=stories;s++){ g.beginPath(); g.moveTo(0,s*rowH); g.lineTo(W,s*rowH); g.stroke(); }
  const cols=6;
  for(let s=0;s<stories;s++){
    for(let i=0;i<cols;i++){
      const wx=8+i*(W-16)/cols, ww=(W-16)/cols-8, wy=s*rowH+10, wh=rowH-20;
      const r=rnd();
      let col;
      if(r<lit){
        const k=rnd();
        col = k<0.5 ? `rgba(255,${170+rnd()*60|0},${100+rnd()*40|0},0.95)`   // warm
            : k<0.8 ? `rgba(${150+rnd()*40|0},${190+rnd()*40|0},255,0.9)`    // cool
                    : `rgba(${120+rnd()*40|0},255,${190+rnd()*40|0},0.9)`;  // teal
      } else col='rgba(8,12,20,0.92)';
      g.fillStyle=col; g.fillRect(wx,wy,ww,wh);
      g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=2; g.strokeRect(wx,wy,ww,wh);
      g.strokeStyle='rgba(10,12,16,0.8)'; g.lineWidth=1.5;
      g.beginPath(); g.moveTo(wx+ww/2,wy); g.lineTo(wx+ww/2,wy+wh); g.stroke();
    }
  }
  return tex(c);
}
// --- bridge deck road: wet asphalt + expressway markings along z ---
function bridgeRoadTexture(len){
  const W=256, L=2048;
  const [c,g]=cnv(W,L);
  const rnd=mulberry32(4242);
  g.fillStyle='#1a1e26'; g.fillRect(0,0,W,L);   // lifted albedo so it catches light
  for(let i=0;i<9000;i++){
    const v=rnd();
    g.fillStyle=`rgba(${30+v*40|0},${32+v*42|0},${38+v*48|0},${0.22+rnd()*0.25})`;
    g.fillRect(rnd()*W, rnd()*L, 1.6, 1.6);
  }
  // edge lines (x=±3.7 of 8.4 width)
  g.fillStyle='rgba(220,225,235,0.8)';
  const ex=(3.7+4.2)/8.4*W;
  g.fillRect(ex-3,0,6,L); g.fillRect(W-ex-3,0,6,L);
  // center dashed line
  g.fillStyle='rgba(230,235,245,0.85)';
  for(let y=0;y<L;y+=90) g.fillRect(W/2-3,y,6,44);
  // lane dashes at x=±1.9
  for(const lx of [-1.9,1.9]){
    const px=(lx+4.2)/8.4*W;
    for(let y=45;y<L;y+=90) g.fillRect(px-2.5,y,5,40);
  }
  return tex(c);
}

// ---------- lights ----------
// night ambient kept strong enough that no surface reads pitch black
const hemi = new THREE.HemisphereLight(0x46547e, 0x161220, 0.9); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fb0ff, 0.75);
moon.position.set(50, 70, 30); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left=-90; moon.shadow.camera.right=90;
moon.shadow.camera.top=100; moon.shadow.camera.bottom=-100;
moon.shadow.camera.far=500; moon.shadow.bias=-0.0004;
scene.add(moon); scene.add(moon.target); moon.target.position.set(0,0,-60);
const sun = new THREE.DirectionalLight(0xfff2dd, 0.0);
sun.position.set(-40, 60, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-90; sun.shadow.camera.right=90;
sun.shadow.camera.top=100; sun.shadow.camera.bottom=-100;
sun.shadow.camera.far=500; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0,0,-60);
// blue tower wash lights (visible blue light sources at the portals)
const towerLights = [];
for (const zt of [-30,-110]) for (const sx of [-4,4]){
  const p=new THREE.PointLight(0x3a8fff, 0, 60, 1.7);
  p.position.set(sx, 12, zt); scene.add(p); towerLights.push(p);
}
// cool blue counter-fill over the water
const blueFill = new THREE.PointLight(0x3a5aaa, 0, 120, 1.8);
blueFill.position.set(-30, 26, -70); scene.add(blueFill);
// deck lamp pools (night)
const lampLights = [];

// ---------- shared materials ----------
const MAT = {
  steelDark: new THREE.MeshStandardMaterial({ color:0x1a1e26, roughness:0.55, metalness:0.65 }),
  blackSteel:new THREE.MeshStandardMaterial({ color:0x141821, roughness:0.5,  metalness:0.7 }),
  concrete:  new THREE.MeshStandardMaterial({ color:0x3a3e46, roughness:0.9, metalness:0.0 }),
  plinth:    new THREE.MeshStandardMaterial({ color:0x20252e, roughness:0.8, metalness:0.05 }),
  frameDark: new THREE.MeshStandardMaterial({ color:0x101319, roughness:0.45, metalness:0.6 }),
  towerConc: new THREE.MeshStandardMaterial({ color:0x8a8f99, roughness:0.75, metalness:0.05 }),
  towerDark: new THREE.MeshStandardMaterial({ color:0x2c313c, roughness:0.6, metalness:0.35 }),
  poleConc:  new THREE.MeshStandardMaterial({ color:0x2c2f36, roughness:0.9 }),
  white:     new THREE.MeshStandardMaterial({ color:0xd8dce4, roughness:0.7 }),
  craneDark: new THREE.MeshStandardMaterial({ color:0x11161f, roughness:0.9, metalness:0.1 }),
};
const blueStripMat = new THREE.MeshBasicMaterial({ color:0x2f9dff });
regDimBasic(blueStripMat);
function box(w,h,d,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function emissiveBoard(w,h,t,canvasTex,intensity=1.6){
  const m=new THREE.MeshStandardMaterial({ map:canvasTex, emissive:0xffffff,
    emissiveMap:canvasTex, emissiveIntensity:intensity, roughness:0.5, metalness:0.0 });
  regDimStd(m, intensity);
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,t),m);
  mesh.castShadow=true; return mesh;
}
// --- bolted plaque: solid core + lit canvas faces + trim frame + bolt heads ---
// (every sign is physically attached — nothing floats)
function plaqueBoard(w,h,t,text,sub,bg,fg,intensity=1.8){
  const g=new THREE.Group();
  const coreM=new THREE.MeshStandardMaterial({ color:new THREE.Color(bg).multiplyScalar(0.55), roughness:0.5, metalness:0.1 });
  g.add(box(w,h,t,coreM));
  const [c,gg]=cnv(1024, Math.max(128, Math.round(1024*h/w)));
  const H=c.height;
  gg.fillStyle=bg; gg.fillRect(0,0,1024,H);
  gg.strokeStyle=fg; gg.lineWidth=Math.max(6,H*0.03); gg.strokeRect(18,18,1024-36,H-36);
  gg.fillStyle=fg; gg.textAlign='center'; gg.textBaseline='middle';
  gg.shadowColor='rgba(255,255,255,0.35)'; gg.shadowBlur=18;
  let fs=Math.round(H*(sub?0.42:0.55));
  gg.font=`900 ${fs}px ${CJK}`;
  while(gg.measureText(text).width>940 && fs>40){ fs-=8; gg.font=`900 ${fs}px ${CJK}`; }
  gg.fillText(text, 512, H*(sub?0.36:0.52));
  gg.fillText(text, 512, H*(sub?0.36:0.52));
  if(sub){ gg.font=`700 ${Math.round(H*0.16)}px ${CJK}`; gg.fillText(sub, 512, H*0.72); }
  const faceT=tex(c);
  const faceM=new THREE.MeshStandardMaterial({ map:faceT, emissive:0xffffff,
    emissiveMap:faceT, emissiveIntensity:intensity, roughness:0.5, metalness:0.0 });
  regDimStd(faceM, intensity);
  const f1=new THREE.Mesh(new THREE.PlaneGeometry(w,h), faceM);
  f1.position.z=t/2+0.005; g.add(f1);
  const f2=new THREE.Mesh(new THREE.PlaneGeometry(w,h), faceM);
  f2.rotation.y=Math.PI; f2.position.z=-t/2-0.005; g.add(f2);
  // trim frame proud of the faces
  const trimM=new THREE.MeshStandardMaterial({ color:0xd8dce4, roughness:0.4, metalness:0.2 });
  g.add(box(w+0.16,0.1,t+0.06,trimM, 0, h/2+0.05, 0));
  g.add(box(w+0.16,0.1,t+0.06,trimM, 0,-h/2-0.05, 0));
  g.add(box(0.1,h+0.2,t+0.06,trimM, -w/2-0.05, 0, 0));
  g.add(box(0.1,h+0.2,t+0.06,trimM,  w/2+0.05, 0, 0));
  // bolt heads on both faces
  for(const s of [1,-1]) for(const [bx,by] of [[-w/2+0.22,-h/2+0.22],[w/2-0.22,-h/2+0.22],[-w/2+0.22,h/2-0.22],[w/2-0.22,h/2-0.22]]){
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6), MAT.steelDark);
    b.position.set(bx,by,s*(t/2+0.02)); g.add(b);
  }
  return g;
}

// ---------- water (dark bay, y=-5) ----------
const waterMat = new THREE.MeshStandardMaterial({ color:0x0a1424, roughness:0.38, metalness:0.12 });
function buildWater(){
  const w=new THREE.Mesh(new THREE.PlaneGeometry(700, 800), waterMat);
  w.rotation.x=-Math.PI/2; w.position.set(0,-5,-80); w.receiveShadow=true; scene.add(w);
}

// ---------- land masses (near + far shores) ----------
function buildLand(){
  const landMat=new THREE.MeshStandardMaterial({ color:0x141821, roughness:0.95 });
  const near=new THREE.Mesh(new THREE.BoxGeometry(150,5,62), landMat);
  near.position.set(0,-2.5,47); near.receiveShadow=true; scene.add(near);   // z 16..78
  const far=new THREE.Mesh(new THREE.BoxGeometry(300,5,130), landMat);
  far.position.set(0,-2.5,-201); far.receiveShadow=true; scene.add(far);    // z -136..-266
  // quay edge on the near shore (concrete lip at the waterline)
  scene.add(box(150,1.2,1.6,MAT.concrete, 0,-0.4,16.4));
  // asphalt aprons where the road meets the land
  const apMat=new THREE.MeshStandardMaterial({ color:0x1c1f26, roughness:0.85 });
  for(const s of [-1,1]){
    const ap=new THREE.Mesh(new THREE.PlaneGeometry(60,60), apMat);
    ap.rotation.x=-Math.PI/2; ap.position.set(s*38,0.02,47); ap.receiveShadow=true; scene.add(ap);
    const ap2=new THREE.Mesh(new THREE.PlaneGeometry(120,50), apMat);
    ap2.rotation.x=-Math.PI/2; ap2.position.set(s*75,0.02,-160); ap2.receiveShadow=true; scene.add(ap2);
  }
}

// ---------- bridge deck: slab + road + walkways + guardrails + lamps ----------
const DECK = { z0:62, z1:-178 };           // deck extent
const WATERZ = [16,-138];                  // water zone for guardrails/streaks
function buildDeck(){
  const len=DECK.z0-DECK.z1, zc=(DECK.z0+DECK.z1)/2;
  // slab
  const slab=box(11,1.4,len,MAT.concrete, 0,-0.7,zc); slab.receiveShadow=true; scene.add(slab);
  // road surface
  const road=new THREE.Mesh(new THREE.PlaneGeometry(8.4,len),
    new THREE.MeshStandardMaterial({ map:bridgeRoadTexture(len), roughness:0.3, metalness:0.15 }));
  road.rotation.x=-Math.PI/2; road.position.set(0,0.02,zc); road.receiveShadow=true; scene.add(road);
  // walkways (raised, both sides)
  const walkMat=new THREE.MeshStandardMaterial({ color:0x2b2f38, roughness:0.8 });
  for(const s of [-1,1]){
    const w=box(1.5,0.26,len,walkMat, s*4.75,0.13,zc); w.receiveShadow=true; scene.add(w);
  }
  // blue deck-edge light strips over the water (visible source for the water wash)
  for(const s of [-1,1]){
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,WATERZ[1]&& (WATERZ[0]-WATERZ[1])), blueStripMat);
    strip.position.set(s*5.45,0.12,(WATERZ[0]+WATERZ[1])/2); scene.add(strip);
  }
  // guardrails over the water: posts + double rails
  const railMat=MAT.steelDark;
  for(const s of [-1,1]){
    for(let z=WATERZ[0]; z>=WATERZ[1]; z-=4)
      scene.add(box(0.12,1.1,0.12,railMat, s*5.15,0.55,z));
    for(const ry of [0.75,1.05])
      scene.add(box(0.07,0.1,WATERZ[0]-WATERZ[1],railMat, s*5.15,ry,(WATERZ[0]+WATERZ[1])/2));
  }
  buildDeckLamps();
  // water reflections — every one traces to a visible source
  addStreak(0,-70, 150, 0x2f9dff, 0.10, 12, -4.9);   // deck edge strips
  for(const zt of [-30,-110]){
    addStreak(0,zt, 46, 0x2f7fe0, 0.30, 18, -4.9);   // blue tower wash
  }
}
// ---------- Japanese cobra street lamps on the deck ----------
function deckLamp(x,z,lit){
  const g=new THREE.Group();
  g.add(box(0.4,0.2,0.4,MAT.steelDark, 0,0.1,0));
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,7.5,10), MAT.steelDark);
  pole.position.y=3.85; pole.castShadow=true; g.add(pole);
  const dir=x>0?-1:1;
  const arm=new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(0,7.35,0), new THREE.Vector3(dir*1.0,7.6,0), new THREE.Vector3(dir*1.9,7.2,0));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(arm,12,0.055,8), MAT.steelDark));
  g.add(box(0.85,0.14,0.28,MAT.blackSteel, dir*1.9,7.12,0));
  const lensMat=new THREE.MeshBasicMaterial({ color:0xfff0d8 }); regDimBasic(lensMat);
  const lens=new THREE.Mesh(new THREE.PlaneGeometry(0.65,0.2), lensMat);
  lens.rotation.x=Math.PI/2; lens.position.set(dir*1.9,7.03,0); g.add(lens);
  if(lit){
    const p=new THREE.PointLight(0xffe6c0, 0, 34, 1.7);
    p.position.set(dir*1.9,6.9,0); g.add(p); lampLights.push(p);
  }
  addStreak(x+dir*1.0, z, 10, 0xffe6c0, 0.22, 1.8, 0.06);          // pool on the road
  if(z<WATERZ[0] && z>WATERZ[1])
    addStreak(x+dir*1.0, z, 14, 0xffd9a8, 0.26, 2.4, -4.9);        // reflection on water
  g.position.set(x,0.26,z); scene.add(g);
}
function buildDeckLamps(){
  const zs=[8,-12,-32,-52,-72,-92,-112,-132];
  zs.forEach((z,i)=>{
    const x=(i%2===0)? 4.35 : -4.35;

  });
}

// ---------- twin tower portals (blue-lit) ----------
const TOWERS=[-30,-110];
const beaconMat=new THREE.MeshBasicMaterial({ color:0xff2a2a }); // blinked in loop()
const beaconStreaks=[];
function buildTower(zt, near){
  const g=new THREE.Group();
  for(const sx of [-6.5,6.5]){
    g.add(box(1.8,27,2.4,MAT.towerConc, sx,8.5,0));            // column, water->top
    g.add(box(5,5,6,MAT.concrete, sx,-2.5,0));                 // caisson in the water
    g.add(box(2.0,0.8,2.6,MAT.towerDark, sx,0.4,0));           // fender at deck level
    // blue accent strips on the outer column faces (visible blue sources)
    const sgn=Math.sign(sx);
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.12,19,0.55), blueStripMat);
    strip.position.set(sx+sgn*0.96,11.5,0); g.add(strip);
    const strip2=strip.clone(); strip2.position.z=0; strip2.position.x=sx-sgn*0.96; g.add(strip2);
  }
  for(const by of [7.5,15]) g.add(box(15,2,2.6,MAT.towerConc, 0,by,0));  // portal beams
  // blue strip along the mid beam faces
  for(const s of [-1,1]){
    const bs=new THREE.Mesh(new THREE.BoxGeometry(14.6,0.35,0.12), blueStripMat);
    bs.position.set(0,15,s*1.36); g.add(bs);
  }
  // aviation beacon mast + blinking red beacon (1.5 s period)
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,1.8,8), MAT.steelDark);
  mast.position.set(0,22.9,0); g.add(mast);
  const bc=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), beaconMat);
  bc.position.set(0,23.9,0); g.add(bc);
  // bolted name plaque on the mid beam (faces the approaching driver)
  const plaque=plaqueBoard(6.4,1.7,0.3,
    near?'東京湾':'第3新東京市', near?'TOKYO BAY · 湾岸線':'NEO-TOKYO 3 · BAY STRAIT',
    '#0e2a5e','#cfe4ff', 1.7);
  plaque.position.set(0,15, near? 1.55 : -1.55);
  if(!near) plaque.rotation.y=Math.PI;
  g.add(plaque);
  // cleats tying the plaque to the beam
  for(const cx of [-2.4,2.4])
    g.add(box(0.16,0.5,0.5,MAT.blackSteel, cx,15, near?1.15:-1.15));
  g.position.z=zt; scene.add(g);
  // animated red reflection streak under the beacon (traces to the beacon)
  beaconStreaks.push(addStreak(0,zt, 26, 0xff2a2a, 0.5, 2.2, -4.9));
}

// ---------- main cables + suspenders + anchorages ----------
function cableY(z){ const u=(z+70)/40; return 3.5+17*u*u; }  // main-span parabola, apex 20.5 at towers
function tube(points, radius, mat){
  const curve=new THREE.CatmullRomCurve3(points);
  const m=new THREE.Mesh(new THREE.TubeGeometry(curve, 48, radius, 8), mat);
  m.castShadow=true; scene.add(m); return m;
}
function buildCables(){
  const cableMat=new THREE.MeshStandardMaterial({ color:0x3a4048, roughness:0.45, metalness:0.7 });
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  for(const sx of [-5.2,5.2]){
    // main span: tower -> tower catenary
    const pts=[];
    for(let i=0;i<=24;i++){ const z=-30+(-80)*i/24; pts.push(V(sx,cableY(z),z)); }
    tube(pts, 0.17, cableMat);
    // side spans: tower tops down to the land anchorages
    tube([V(sx,20.8,-30),V(sx,12,-2),V(sx,3.4,26)], 0.15, cableMat);
    tube([V(sx,20.8,-110),V(sx,12,-126),V(sx,3.4,-141)], 0.15, cableMat);
    // suspenders: vertical hangers, main span, every 8 m
    for(let z=-34; z>=-106; z-=8){
      const top=cableY(z), h=top-0.5;
      const s=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,h,6), cableMat);
      s.position.set(sx, 0.5+h/2, z); scene.add(s);
    }
    // anchor blocks on land (cables bolt into them)
    scene.add(box(4,3,6,MAT.concrete, sx,1.5,27));
    scene.add(box(4,3,6,MAT.concrete, sx,1.5,-142));
    // cable bands where the side span meets the anchorage
    scene.add(box(0.7,0.7,0.7,MAT.blackSteel, sx,3.4,26));
    scene.add(box(0.7,0.7,0.7,MAT.blackSteel, sx,3.4,-141));
  }
}

// ---------- utility poles + catenary wires on the land approaches ----------
const wireMat = new THREE.MeshBasicMaterial({ color:0x050507 });
function catenary(a, b, sag, radius=0.025){
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5); mid.y-=sag;
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(
    new THREE.QuadraticBezierCurve3(a,mid,b), 20, radius, 6), wireMat));
}
function poleWithSign(x,z,sign){
  const g=new THREE.Group();
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.18,9.5,10), MAT.poleConc);
  p.position.y=4.9; p.castShadow=true; g.add(p);
  g.add(box(0.35,0.3,0.35,MAT.poleConc, 0,0.3,0));
  for(const cy of [8.6,8.0]) g.add(box(1.6,0.09,0.09,MAT.poleConc, 0,cy,0));
  for(const ix of [-0.65,0.65]) g.add(box(0.12,0.22,0.12,MAT.poleConc, ix,8.75,0));
  if(sign){
    // 架空線注意 plate bolted to the pole
    const [c,gg]=cnv(128,256);
    gg.fillStyle='#e8b800'; gg.fillRect(0,0,128,256);
    gg.strokeStyle='#111'; gg.lineWidth=8; gg.strokeRect(8,8,112,240);
    gg.fillStyle='#111'; gg.textAlign='center'; gg.font=`900 40px ${CJK}`;
    const ch=[...'架空線注意'];
    ch.forEach((t,i)=> gg.fillText(t, 64, 52+i*40));
    const board=emissiveBoard(0.5,1.0,0.06,tex(c),1.3);
    board.position.set(0,5.6,0.16); g.add(board);
    g.add(box(0.5,0.08,0.1,MAT.blackSteel, 0,6.15,0.1));  // mounting strap
    g.add(box(0.5,0.08,0.1,MAT.blackSteel, 0,5.05,0.1));
  }
  g.position.set(x,0,z); scene.add(g);
}
function buildApproachPoles(){
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const nearZ=[24,38,52], farZ=[-148,-162];
  nearZ.forEach((z,i)=> poleWithSign(-8.5,z, i===0));
  farZ.forEach((z)=> poleWithSign(8.5,z, false));
  for(let i=0;i<nearZ.length-1;i++)
    for(const dx of [-0.65,0.65])
      catenary(V(-8.5+dx,8.6,nearZ[i]), V(-8.5+dx,8.6,nearZ[i+1]), 1.2);
  for(const dx of [-0.65,0.65])
    catenary(V(8.5+dx,8.6,farZ[0]), V(8.5+dx,8.6,farZ[1]), 1.2);
  // wires diving from the last near pole toward the bridge anchorage zone
  for(const dx of [-0.65,0.65])
    catenary(V(-8.5+dx,8.6,52), V(-8.5+dx,7.5,64), 0.8);
}

// ---------- land-approach props: warehouses, containers, quay crates ----------
function warehouse(x,z,w,h,d,seed,signText,signSub,faceDir){
  const g=new THREE.Group();
  const bodyM=new THREE.MeshStandardMaterial({ color:0x39404c, roughness:0.85 });
  const body=box(w,h,d,bodyM, 0,h/2,0); g.add(body);
  g.add(box(w+0.5,0.4,d+0.5,MAT.plinth, 0,h+0.2,0));        // parapet
  // lit roller-door band facing the road
  const [dc,dg]=cnv(256,64);
  dg.fillStyle='#0c0e13'; dg.fillRect(0,0,256,64);
  dg.fillStyle='#ffd9a0'; dg.fillRect(10,8,236,48);
  dg.fillStyle='rgba(0,0,0,0.35)';
  for(let i=0;i<8;i++) dg.fillRect(10,8+i*6,236,2);
  const doorM=new THREE.MeshBasicMaterial({ map:tex(dc) }); regDimBasic(doorM);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(4.2,1.9), doorM);
  door.position.set(faceDir*(w/2+0.03), 1.35, 0);
  door.rotation.y=faceDir>0? Math.PI/2 : -Math.PI/2;
  g.add(door);
  // bolted sign plaque above the door
  const sign=plaqueBoard(5.2,1.3,0.25, signText, signSub, '#12305e', '#e8f2ff', 1.6);
  sign.position.set(faceDir*(w/2+0.18), h-1.6, 0);
  sign.rotation.y=faceDir>0? Math.PI/2 : -Math.PI/2;
  g.add(sign);
  for(const dz of [-1.8,1.8])
    g.add(box(0.5,0.14,0.14,MAT.blackSteel, faceDir*(w/2+0.06), h-1.6, dz));
  // roof vent boxes (attached)
  const rnd=mulberry32(seed);
  for(let i=0;i<3;i++)
    g.add(box(1.2,0.8,1.2,MAT.steelDark, (rnd()-0.5)*w*0.6, h+0.8, (rnd()-0.5)*d*0.6));
  g.position.set(x,0,z); scene.add(g);
}

// ---------- far-shore skyline: dense Akira-style lit towers ----------
function skylineTower(x,z,w,h,d,seed){
  const stories=Math.max(4,Math.round(h/3.4));
  const ft=skylineFacadeTexture(seed, stories, 0.65);
  const facMat=new THREE.MeshStandardMaterial({ map:ft, emissive:0xffffff,
    emissiveMap:ft, emissiveIntensity:1.25, roughness:0.85 });
  regDimStd(facMat, 1.25);
  const sideM=new THREE.MeshStandardMaterial({ color:0x131a26, roughness:0.9 });
  const topM=new THREE.MeshStandardMaterial({ color:0x0c1018, roughness:0.95 });
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), [facMat,facMat,topM,topM,facMat,facMat]);
  m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  // rooftop beacon dot on the tallest towers
  if(h>38){
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.35,8,6), beaconMat);
    dot.position.set(x,h+0.8,z); scene.add(dot);
  }
}
function buildSkyline(){
  const rnd=mulberry32(20260919);
  const spots=[];
  // back row (far, tall)
  for(let i=0;i<9;i++){
    const x=-110+i*27+(rnd()-0.5)*10, z=-200-rnd()*25;
    const h=30+rnd()*28, w=12+rnd()*8;
    if(Math.abs(x)<22) continue;   // keep the road corridor clear
    spots.push([x,z,w,h,14+rnd()*6,100+i]);
  }
  // mid row (flanking, medium)
  for(let i=0;i<6;i++){
    const x=(i%2?1:-1)*(30+rnd()*45), z=-165-rnd()*20;
    spots.push([x,z,10+rnd()*6,18+rnd()*14,12+rnd()*5,200+i]);
  }
  for(const s of spots) skylineTower(...s);
  // soft cool reflections of the skyline on the water (trace to the lit towers)
  for(const x of [-60,-20,25,70])
    addStreak(x,-186, 30, 0x9fc4ff, 0.12, 6, -4.9);
}
// ---------- port cranes: 4 silhouettes on the far quay + dim shore lights ----------
function portCrane(x,z,seed){
  const g=new THREE.Group();
  const rnd=mulberry32(seed);
  const h=26+rnd()*6;
  for(const sx of [-3,3]) for(const sz of [-2.5,2.5])
    g.add(box(1.1,h,1.1,MAT.craneDark, sx,h/2,sz));            // legs
  g.add(box(8.5,1.6,7,MAT.craneDark, 0,h+0.8,0));              // machinery house
  const boom=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.3,26), MAT.craneDark);
  boom.position.set(0,h+2.2,-12); boom.rotation.x=0.42; boom.castShadow=true; g.add(boom); // raised boom
  const tie=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,16,6), MAT.craneDark);
  tie.position.set(0,h+9,-6); tie.rotation.x=1.05; g.add(tie);
  // red obstruction light on the machinery house (blinks with the tower beacons)
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,6), beaconMat);
  dot.position.set(0,h+2.2,0); g.add(dot);
  // dim warm work light under the machinery house (visible shore light)
  const wl=new THREE.MeshBasicMaterial({ color:0xffc98a }); regDimBasic(wl);
  const lamp=new THREE.Mesh(new THREE.PlaneGeometry(1.6,0.8), wl);
  lamp.position.set(0,h-1.2,3.55); g.add(lamp);
  addStreak(x, z, 20, 0xffc98a, 0.10, 3, -4.9);
  g.position.set(x,0,z); scene.add(g);
}
function buildCranes(){
  portCrane(-80,-172, 1); portCrane(-48,-176, 2);
  portCrane(44,-174, 3); portCrane(76,-170, 4);
  // dim shore-light dots along the far quay
  for(const x of [-95,-64,-32,0,32,64,95]){
    const m=new THREE.MeshBasicMaterial({ color:0xffd9a8 }); regDimBasic(m);
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6), m);
    dot.position.set(x,1.6,-168); scene.add(dot);
    addStreak(x,-170, 12, 0xffd9a8, 0.10, 1.6, -4.9);

}
// ---------- sky dome + silhouette + moon ----------
let silhouetteMat, moonGroup;
function buildSky(){
  const skyMat=new THREE.MeshBasicMaterial({ map:skyTexture(true), side:THREE.BackSide, fog:false, depthWrite:false });
  const dome=new THREE.Mesh(new THREE.SphereGeometry(520,32,20), skyMat);
  dome.position.set(0,0,-60); scene.add(dome);
  window.__sp2sky={ skyMat, day:skyTexture(false), night:skyMat.map };
  silhouetteMat=new THREE.MeshBasicMaterial({ map:skylineTexture(), transparent:true,
    opacity:0.85, fog:false, depthWrite:false });
  const sil=new THREE.Mesh(new THREE.PlaneGeometry(900,110), silhouetteMat);
  sil.position.set(0,40,-300); scene.add(sil);
  // moon: separate emissive disc + halo (traceable source)
  moonGroup=new THREE.Group();
  const disc=new THREE.Mesh(new THREE.CircleGeometry(13,32),
    new THREE.MeshBasicMaterial({ color:0xe8f0ff, fog:false }));
  moonGroup.add(disc);
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(64,64),
    new THREE.MeshBasicMaterial({ map:glowTex, color:0x9fb8ff, transparent:true, opacity:0.5,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
  moonGroup.add(halo);
  moonGroup.position.set(150,180,-330);
  moonGroup.lookAt(0,20,-60);
  scene.add(moonGroup);
}

// ---------- day/night ----------
function setNight(on){
  document.getElementById('btn-night').classList.toggle('on', on);
  document.getElementById('btn-day').classList.toggle('on', !on);
  if (on){
    scene.background.set(0x05070e); scene.fog.color.set(0x060a16);
    hemi.intensity=0.9; hemi.color.set(0x46547e); hemi.groundColor.set(0x161220);
    moon.intensity=0.75; sun.intensity=0.0;
    towerLights.forEach(p=>p.intensity=42);
    lampLights.forEach(p=>p.intensity=30); blueFill.intensity=30;
    waterMat.color.set(0x0a1424); waterMat.roughness=0.38;
    silhouetteMat.opacity=0.85; moonGroup.visible=true;
    renderer.toneMappingExposure=1.35;
    window.__sp2sky.skyMat.map=window.__sp2sky.night;
  } else {
    scene.background.set(0x9fc3e8); scene.fog.color.set(0x9fc3e8);
    hemi.intensity=1.25; hemi.color.set(0xbfd9ff); hemi.groundColor.set(0x6a7078);
    moon.intensity=0.0; sun.intensity=3.6;
    towerLights.forEach(p=>p.intensity=0);
    lampLights.forEach(p=>p.intensity=0); blueFill.intensity=0;
    waterMat.color.set(0x1d3a52); waterMat.roughness=0.55;
    silhouetteMat.opacity=0.3; moonGroup.visible=false;
    renderer.toneMappingExposure=1.0;
    window.__sp2sky.skyMat.map=window.__sp2sky.day;
  }
  window.__sp2sky.skyMat.needsUpdate=true;
  applyDim(on);
  window.__sp.night=on;
}
document.getElementById('btn-day').onclick=()=>setNight(false);
document.getElementById('btn-night').onclick=()=>setNight(true);

// ---------- orbit (showroom pattern) ----------
const orbit={ theta:0.55, phi:1.32, radius:62, target:new THREE.Vector3(0,3,-58), auto:false };
let dragging=false, px=0, py=0;
canvas.addEventListener('pointerdown', e=>{ dragging=true; px=e.clientX; py=e.clientY; orbit.auto=false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  orbit.theta-=(e.clientX-px)*0.007;
  orbit.phi=THREE.MathUtils.clamp(orbit.phi-(e.clientY-py)*0.007, 0.12, Math.PI-0.08);
  px=e.clientX; py=e.clientY;
});
canvas.addEventListener('pointerup', ()=>{ dragging=false; });
canvas.addEventListener('pointercancel', ()=>{ dragging=false; });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  orbit.radius=THREE.MathUtils.clamp(orbit.radius*(1+Math.sign(e.deltaY)*0.1), 4, 260);
  orbit.auto=false;
}, { passive:false });

// street view: on the deck, vanishing point down the straight through both towers
function streetView(){
  orbit.target.set(0, 5, -45);
  orbit.theta=0.0; orbit.phi=1.62; orbit.radius=24; orbit.auto=false;
}
// hero: wide night view from the starboard side
function heroView(){
  orbit.target.set(0, 3, -58);
  orbit.theta=0.55; orbit.phi=1.32; orbit.radius=62; orbit.auto=false;
}
function setView(theta, phi, radius, tx, ty, tz){
  orbit.theta=theta; orbit.phi=phi; orbit.radius=radius;
  orbit.target.set(tx,ty,tz); orbit.auto=false;
}
document.getElementById('btn-cam').onclick=streetView;

function sizeRenderer(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(w, h, false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', sizeRenderer);

// ---------- assembly ----------
function build(){
  buildWater();
  buildLand();
  buildDeck();
  buildTower(-30, true);
  buildTower(-110, false);
  buildCables();
  buildApproachPoles();
  buildProps();
  buildSkyline();
  buildCranes();
  buildSky();
}

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  // aviation beacons: slow blink, ~1.5 s period (also drives their water streaks)
  const t=clock.getElapsedTime();
  const ph=(t%1.5)/1.5;
  const b=ph<0.10 ? 1.0 : 0.05;
  const peak=window.__sp.night?1.0:0.55;
  beaconMat.color.setRGB(1.0*(0.05+b*peak), 0.10*b*peak, 0.10*b*peak);
  for(const sm of beaconStreaks) sm.opacity=(window.__sp.night?0.55:0.18)*b;
  if (orbit.auto) orbit.theta+=0.003;
  const sp=Math.sin(orbit.phi);
  camera.position.set(
    orbit.target.x+orbit.radius*sp*Math.sin(orbit.theta),
    orbit.target.y+orbit.radius*Math.cos(orbit.phi),
    orbit.target.z+orbit.radius*sp*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
  renderer.render(scene, camera);
}

window.__sp={ night:true, ready:false, setNight, streetView, setView, scene, camera,
  state:()=>({ ready:window.__sp.ready, night:window.__sp.night,
    objects:scene.children.length,
    cam:camera.position.toArray().map(v=>+v.toFixed(2)) }) };

sizeRenderer();
build();            // creates window.__sp2sky before setNight touches it
setNight(true);
heroView();
window.__sp.ready=true;
statusEl.textContent='ready — bay strait suspension bridge · twin blue portals · night';
loop();
</script>
