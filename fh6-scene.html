<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FH6 Night Street — 3D Diorama</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}
  #view{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #view:active{cursor:grabbing}
  #hud{position:fixed;top:12px;left:14px;color:#fff;font:13px/1.5 system-ui,sans-serif;
    text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
  #hud b{font-size:15px;letter-spacing:.5px}
  #bar{position:fixed;top:12px;right:14px;z-index:6;display:flex;gap:8px}
  #bar button{background:rgba(20,24,32,.85);color:#fff;border:1px solid #3a4356;border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer}
  #bar button.on{background:#1c3a5e;border-color:#58a6ff}
  #status{position:fixed;bottom:12px;left:14px;color:#9aa4b5;font:12px system-ui,sans-serif;
    text-shadow:0 1px 3px #000;z-index:5}
  #hint{position:fixed;bottom:12px;right:14px;color:#9aa4b5;font:12px system-ui,sans-serif;z-index:5}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><b>FH6 Night Street — 3D diorama</b><br><span id="sub">static scene · orbit showroom</span></div>
<div id="bar">
  <button id="btn-day">☀ Day</button>
  <button id="btn-night" class="on">🌙 Night</button>
  <button id="btn-cam">📷 Street view</button>
</div>
<div id="status">loading…</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const MDIR = './public/models/fh6/';
const statusEl = document.getElementById('status');

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;               // dynamic shadows only — nothing baked
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a18);
scene.fog = new THREE.Fog(0x060a18, 60, 190);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);

// ---------- seeded prng ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*f)|0,g=Math.min(255,((n>>8)&255)*f)|0,b=Math.min(255,(n&255)*f)|0;return `rgb(${r},${g},${b})`;}

// ---------- procedural canvas textures ----------
// kanji-like glyph strokes: BOLD signage glyphs — large, thick, high-contrast.
// Convincing at showroom distance, never real text.
function drawKanjiBold(g, cx, cy, s, fg, rnd){
  g.strokeStyle = fg; g.fillStyle = fg; g.lineCap = 'round';
  const strokes = 4 + Math.floor(rnd()*3);
  for(let i=0;i<strokes;i++){
    const lw = s*(0.09+rnd()*0.05);
    g.lineWidth = lw;
    const kind = rnd();
    const ox = (rnd()-0.5)*s*0.7, oy = (rnd()-0.5)*s*0.7;
    if(kind < 0.10){
      // solid block (bold radical)
      const bw = s*(0.3+rnd()*0.3), bh = s*(0.1+rnd()*0.1);
      if(rnd()<0.5) g.fillRect(cx+ox-bw/2, cy+oy-bh/2, bw, bh);
      else g.fillRect(cx+ox-bh/2, cy+oy-bw/2, bh, bw);
    } else {
      const len = s*(0.5+rnd()*0.6);
      const horiz = kind < 0.55, diag = !horiz && rnd() < 0.3;
      const x1 = cx+ox, y1 = cy+oy;
      let x2 = x1, y2 = y1;
      if(horiz){ x2 = x1+len*(rnd()<0.5?-1:1)*0.5; y2 = y1+(rnd()-0.5)*s*0.2; }
      else if(diag){ x2 = x1+len*0.45*(rnd()<0.5?-1:1); y2 = y1+len*0.45*(rnd()<0.5?-1:1); }
      else { x2 = x1+(rnd()-0.5)*s*0.2; y2 = y1+len*(rnd()<0.5?-1:1)*0.5; }
      // recenter: draw the stroke centered on (x1,y1)
      g.beginPath(); g.moveTo(x1-(x2-x1), y1-(y2-y1)); g.lineTo(x1+(x2-x1), y1+(y2-y1)); g.stroke();
    }
  }
  if(rnd()<0.45){ g.lineWidth = s*0.08; g.strokeRect(cx-s*0.55, cy-s*0.55, s*1.1, s*1.1); }
}
function drawKanjiLike(g, cx, cy, s, fg, rnd){ drawKanjiBold(g, cx, cy, s, fg, rnd); }
function kanbanTexture(bg, fg, seed, horizontal=false){
  const w = horizontal?512:256, h = horizontal?256:512;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'), rnd = mulberry32(seed);
  const grad = g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, shade(bg,1.12)); grad.addColorStop(0.55, shade(bg,0.95)); grad.addColorStop(1, shade(bg,0.62));
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  // lit-panel sheen
  const sheen = g.createLinearGradient(0,0,w,0);
  sheen.addColorStop(0,'rgba(255,255,255,0)'); sheen.addColorStop(0.5,'rgba(255,255,255,0.10)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = sheen; g.fillRect(0,0,w,h);
  g.strokeStyle = fg; g.lineWidth = Math.max(3, w*0.025);
  g.strokeRect(g.lineWidth, g.lineWidth, w-2*g.lineWidth, h-2*g.lineWidth);
  if(horizontal){
    const n = 2 + Math.floor(rnd()*2), cw = (w*0.84)/n;
    for(let i=0;i<n;i++) drawKanjiBold(g, w*0.08+cw*(i+0.5), h*0.5, Math.min(cw,h)*0.42, fg, rnd);
  } else {
    // optional title band at top (shop name), then a column of large glyphs
    let top = h*0.06;
    if(rnd() < 0.6){
      const bandH = h*0.13;
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(w*0.08, top, w*0.84, bandH);
      const n2 = 2 + Math.floor(rnd()*2);
      for(let i=0;i<n2;i++)
        drawKanjiBold(g, w*0.08 + (w*0.84)*(i+0.5)/n2, top + bandH/2, bandH*0.36, fg, rnd);
      top += bandH + h*0.04;
      g.fillStyle = fg; g.fillRect(w*0.1, top - h*0.02, w*0.8, Math.max(3, h*0.008));
    }
    const n = 2 + Math.floor(rnd()*2), avail = h*0.94 - top, ch = avail/n;
    for(let i=0;i<n;i++)
      drawKanjiBold(g, w*0.5, top + ch*(i+0.5), Math.min(w*0.62, ch*0.72), fg, rnd);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function rakuTexture(){
  const c = document.createElement('canvas'); c.width=512; c.height=160;
  const g = c.getContext('2d');
  g.clearRect(0,0,512,160);
  g.font = '900 92px system-ui, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth = 10; g.strokeStyle = 'rgba(0,30,15,0.9)'; g.strokeText('RAKU RAKU', 256, 84);
  g.fillStyle = '#f4fff6'; g.fillText('RAKU RAKU', 256, 84);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function directionSignTexture(){
  const c = document.createElement('canvas'); c.width=512; c.height=256;
  const g = c.getContext('2d'), rnd = mulberry32(42);
  g.fillStyle = '#0d3fa8'; g.fillRect(0,0,512,256);
  g.strokeStyle = '#eaf1ff'; g.lineWidth = 8; g.strokeRect(8,8,496,240);
  // glyph rows (destination names)
  for(let r=0;r<2;r++) for(let i=0;i<4;i++) drawKanjiLike(g, 60+i*62, 70+r*70, 26, '#eaf1ff', rnd);
  // big right arrow
  g.fillStyle = '#ffffff';
  g.fillRect(360, 108, 100, 40);
  g.beginPath(); g.moveTo(460,88); g.lineTo(504,128); g.lineTo(460,168); g.closePath(); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function streakTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(255,255,255,0.85)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0,0,64,256);
  // horizontal soft falloff
  const img = g.getImageData(0,0,64,256), d = img.data;
  for(let y=0;y<256;y++) for(let x=0;x<64;x++){
    const f = Math.sin(Math.PI*x/64);
    d[(y*64+x)*4+3] *= f;
  }
  g.putImageData(img,0,0);
  return new THREE.CanvasTexture(c);
}
function awningTexture(c1, c2){
  const c = document.createElement('canvas'); c.width=128; c.height=64;
  const g = c.getContext('2d');
  for(let i=0;i<8;i++){ g.fillStyle = i%2?c1:c2; g.fillRect(i*16,0,16,64); }
  g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(0,48,128,16);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2,1);
  return t;
}
function barrierTexture(){
  const c = document.createElement('canvas'); c.width=256; c.height=64;
  const g = c.getContext('2d');
  g.fillStyle='#e8640a'; g.fillRect(0,0,256,64);
  g.fillStyle='#f5f2ea';
  for(let i=-2;i<10;i++){ g.save(); g.translate(i*40,0); g.rotate(Math.PI/4); g.fillRect(0,-40,20,160); g.restore(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function skyTexture(night){
  const c = document.createElement('canvas'); c.width=1024; c.height=512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,512);
  if(night){
    grad.addColorStop(0,'#020409'); grad.addColorStop(0.45,'#0a1030');
    grad.addColorStop(0.62,'#2a1a3d'); grad.addColorStop(0.70,'#c65a1e');
    grad.addColorStop(0.74,'#3a2030'); grad.addColorStop(1,'#05070c');
  } else {
    grad.addColorStop(0,'#3f7fd0'); grad.addColorStop(0.6,'#9cc6ee');
    grad.addColorStop(0.72,'#e8d9b8'); grad.addColorStop(1,'#b8c4cc');
  }
  g.fillStyle = grad; g.fillRect(0,0,1024,512);
  const rnd = mulberry32(7);
  if(night){
    for(let i=0;i<420;i++){ // stars
      const y = rnd()*300, x = rnd()*1024;
      g.fillStyle = `rgba(255,255,255,${0.25+rnd()*0.6})`;
      g.fillRect(x, y, rnd()<0.12?2:1, rnd()<0.12?2:1);
    }
    // magenta/cyan glow blobs low on the horizon (city light pollution)
    for(const [hx,col] of [[220,'rgba(255,60,160,0.10)'],[520,'rgba(60,200,255,0.10)'],[820,'rgba(255,120,40,0.12)']]){
      const rg = g.createRadialGradient(hx,360,10,hx,360,180);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0,180,1024,220);
    }
  } else {
    g.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<14;i++){ const x=rnd()*1024,y=40+rnd()*180; g.beginPath(); g.ellipse(x,y,40+rnd()*60,12+rnd()*10,0,0,7); g.fill(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function skylineTexture(){
  const c = document.createElement('canvas'); c.width=2048; c.height=256;
  const g = c.getContext('2d'), rnd = mulberry32(99);
  g.clearRect(0,0,2048,256);
  let x = 0;
  while(x < 2048){
    const bw = 40+rnd()*110, bh = 60+rnd()*150;
    g.fillStyle = '#04060b'; g.fillRect(x, 256-bh, bw, bh);
    // lit windows
    for(let wy=256-bh+8; wy<248; wy+=12) for(let wx=x+5; wx<x+bw-5; wx+=10){
      if(rnd()<0.35){
        const warm = rnd()<0.6;
        g.fillStyle = warm?`rgba(255,${170+rnd()*40|0},90,0.9)`:`rgba(140,200,255,0.85)`;
        g.fillRect(wx, wy, 5, 6);
      }
    }
    // aviation beacon
    if(rnd()<0.5){ g.fillStyle='#ff2222'; g.fillRect(x+bw/2-2, 256-bh-6, 4, 4); }
    x += bw + rnd()*30;
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// lights (built once, retuned by day/night)
const hemi = new THREE.HemisphereLight(0x2a3a5f, 0x0a0c12, 0.55); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fb0ff, 0.4);
moon.position.set(-25, 40, 20); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left=-60; moon.shadow.camera.right=60;
moon.shadow.camera.top=60; moon.shadow.camera.bottom=-60;
moon.shadow.camera.far=160; moon.shadow.bias=-0.0004;
scene.add(moon); scene.add(moon.target); moon.target.position.set(0,0,-30);
const sun = new THREE.DirectionalLight(0xfff2dd, 0.0);
sun.position.set(30, 50, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
sun.shadow.camera.far=180; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0,0,-30);
// warm streetlight pools (night)
const pools = [];
const poolPos = [[-8.6,-8],[8.6,-14],[-8.6,-22],[8.6,-30],[-8.6,-38],[8.6,-46],[-8.6,-54]];
for (const [x,z] of poolPos){
  const p = new THREE.PointLight(0xffc37a, 0, 28, 1.6);
  p.position.set(x*0.82, 7.2, z); scene.add(p); pools.push(p);
}
// cool storefront wash + magenta/cyan sign accents (night color bleed)
const wash = new THREE.PointLight(0x9fd8ff, 0, 40, 1.6);
wash.position.set(0, 4, -25); scene.add(wash);
const accentMag = new THREE.PointLight(0xff2a7a, 0, 22, 1.8); accentMag.position.set(7.0, 5.0, -12); scene.add(accentMag);
const accentCyn = new THREE.PointLight(0x22ccff, 0, 22, 1.8); accentCyn.position.set(-7.0, 5.0, -24); scene.add(accentCyn);

// night-sky dome + distant skyline (replaces the old blue placeholder plane)
const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture(true), side: THREE.BackSide, fog:false, depthWrite:false });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(320, 32, 20), skyMat);
skyDome.position.set(0, 0, -60); scene.add(skyDome);
const daySkyTex = skyTexture(false), nightSkyTex = skyMat.map;
const skylineMat = new THREE.MeshBasicMaterial({ map: skylineTexture(), transparent:true, fog:false, depthWrite:false });
const skyline = new THREE.Mesh(new THREE.PlaneGeometry(560, 70), skylineMat);
skyline.position.set(0, 26, -175); scene.add(skyline);

function setNight(on){
  document.getElementById('btn-night').classList.toggle('on', on);
  document.getElementById('btn-day').classList.toggle('on', !on);
  if (on){
    scene.background.set(0x060a18); scene.fog.color.set(0x060a18);
    hemi.intensity=0.55; hemi.color.set(0x2a3a5f); hemi.groundColor.set(0x0a0c12);
    moon.intensity=0.4; sun.intensity=0.0;
    pools.forEach(p=>p.intensity=3.2); wash.intensity=40;
    accentMag.intensity=8; accentCyn.intensity=8;
    renderer.toneMappingExposure=1.3;
    skyMat.map = nightSkyTex; skyline.visible = true;
  } else {
    scene.background.set(0x9fc3e8); scene.fog.color.set(0x9fc3e8);
    hemi.intensity=1.1; hemi.color.set(0xbfd9ff); hemi.groundColor.set(0x6a7078);
    moon.intensity=0.0; sun.intensity=2.6;
    pools.forEach(p=>p.intensity=0); wash.intensity=0;
    accentMag.intensity=0; accentCyn.intensity=0;
    renderer.toneMappingExposure=1.0;
    skyMat.map = daySkyTex; skyline.visible = false;
  }
  skyMat.needsUpdate = true;
  window.__fh6.night = on;
}
document.getElementById('btn-day').onclick = ()=>setNight(false);
document.getElementById('btn-night').onclick = ()=>setNight(true);

// --- inline orbit (showroom pattern) ---
const orbit = { theta:0.0, phi:1.25, radius:34, target:new THREE.Vector3(0,3.5,-16), auto:false };
let dragging=false, px=0, py=0;
canvas.addEventListener('pointerdown', e=>{ dragging=true; px=e.clientX; py=e.clientY; orbit.auto=false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  orbit.theta -= (e.clientX-px)*0.007;
  orbit.phi = THREE.MathUtils.clamp(orbit.phi-(e.clientY-py)*0.007, 0.12, Math.PI-0.08);
  px=e.clientX; py=e.clientY;
});
canvas.addEventListener('pointerup', ()=>{ dragging=false; });
canvas.addEventListener('pointercancel', ()=>{ dragging=false; });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  orbit.radius = THREE.MathUtils.clamp(orbit.radius*(1+Math.sign(e.deltaY)*0.1), 4, 160);
  orbit.auto=false;
}, { passive:false });

function streetView(){
  // match the reference photo: low, behind the van, looking down the avenue
  orbit.target.set(0.5, 2.6, -18);
  orbit.theta = 0.0; orbit.phi = 1.32; orbit.radius = 30; orbit.auto=false;
}
function setView(theta, phi, radius, tx, ty, tz){
  orbit.theta=theta; orbit.phi=phi; orbit.radius=radius;
  orbit.target.set(tx,ty,tz); orbit.auto=false;
}
document.getElementById('btn-cam').onclick = streetView;

function sizeRenderer(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', sizeRenderer);

// --- scene assembly (from fh6-scene/scene-plan.json) ---
const loader = new GLTFLoader();
const cache = new Map();
const EMISSIVE_INTENSITY_MULTIPLIER = 1.0;   // toned down: glyph-textured signs set their own glow
function loadGLB(file){
  if (cache.has(file)) return cache.get(file);
  const p = new Promise((res, rej)=>loader.load(MDIR+file, gltf=>{
    gltf.scene.traverse(n=>{
      if (!n.isMesh) return;
      const materials = Array.isArray(n.material) ? n.material : [n.material];
      materials.forEach(m=>{ if (m && 'emissiveIntensity' in m) m.emissiveIntensity *= EMISSIVE_INTENSITY_MULTIPLIER; });
    });
    res(gltf);
  }, undefined, rej));
  cache.set(file, p); return p;
}
async function place(file, x, y, z, rotY=0){
  const gltf = await loadGLB(file);
  const o = gltf.scene.clone(true);
  o.position.set(x, y, z); o.rotation.y = rotY;
  o.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; } });
  scene.add(o); return o;
}

const KANBAN = { orange:'bt-fh6-sign-orange.glb', red:'bt-fh6-sign-red.glb',
  green:'bt-fh6-sign-green.glb', magenta:'bt-fh6-sign-magenta.glb', blue:'bt-fh6-sign-blue.glb' };
// sign face palettes (bg, glyph fg) — vivid, varied
const KANBAN_STYLE = {
  sign_or:  ['#c33d08', '#ffe9c9'],
  sign_red: ['#a01010', '#ffe3e3'],
  sign_grn: ['#0a7a3a', '#e2ffe9'],
  sign_blu: ['#0e3fa0', '#e3ecff'],
  sign_mag: ['#a0125e', '#ffe3f1'],
};
function applyKanbanTexture(obj, seed){
  obj.traverse(n=>{
    if(!n.isMesh) return;
    const mats = Array.isArray(n.material) ? n.material : [n.material];
    mats.forEach(m=>{
      if(!m || !m.name) return;
      for(const key of Object.keys(KANBAN_STYLE)){
        if(m.name.includes('_'+key) || m.name.endsWith(key)){
          const [bg, fg] = KANBAN_STYLE[key];
          const tex = kanbanTexture(bg, fg, seed);
          // The GLB board meshes carry trim-sheet/atlas UVs (u in [0.13,0.88] etc.),
          // so a fresh texture would sample the wrong region. Swap in a clean box
          // with standard 0-1 UVs, sized to the original board's bounds.
          n.geometry.computeBoundingBox();
          const bb = n.geometry.boundingBox;
          const sx = Math.max(0.01, bb.max.x-bb.min.x),
                sy = Math.max(0.01, bb.max.y-bb.min.y),
                sz = Math.max(0.01, bb.max.z-bb.min.z);
          const cx = (bb.max.x+bb.min.x)/2,
                cy = (bb.max.y+bb.min.y)/2,
                cz = (bb.max.z+bb.min.z)/2;
          const g = new THREE.BoxGeometry(sx, sy, sz);
          g.translate(cx, cy, cz);
          n.geometry = g;
          n.material = new THREE.MeshStandardMaterial({
            map: tex, emissive: 0xffffff, emissiveMap: tex,
            emissiveIntensity: 1.15, roughness: 0.55, metalness: 0.0,
          });
        }
      }
    });
  });
}

const wireMat = new THREE.MeshBasicMaterial({ color:0x050507 });
function catenary(a, b, sag, radius=0.025){
  const mid = new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5); mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, radius, 6), wireMat);
  scene.add(mesh); return mesh;
}

const streakTex = streakTexture();
function lampReflection(x, z, tint=0xffc37a){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 8),
    new THREE.MeshBasicMaterial({ map: streakTex, color: tint, transparent:true,
      opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0.13, z); g.add(m);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(1.5, 20),
    new THREE.MeshBasicMaterial({ color: tint, transparent:true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite:false }));
  pool.rotation.x = -Math.PI/2; pool.position.set(x, 0.12, z); g.add(pool);
  scene.add(g);
}

async function build(){
  const jobs = [];
  // ground + markings
  jobs.push(place('bt-fh6-ground.glb', 0, 0, -30));
  jobs.push(place('bt-fh6-markings.glb', 0, 0, -30));
  // buildings: left row faces +X (rotY=PI/2), right row faces -X (rotY=-PI/2)
  const L = [
    ['bt-fh6-bldg-a.glb', -16, -5,  Math.PI/2],
    ['bt-fh6-bldg-b.glb', -16, -18, Math.PI/2],
    ['bt-fh6-bldg-a.glb', -16, -33, Math.PI/2],
    ['bt-fh6-bldg-c.glb', -16, -50, Math.PI/2],
  ];
  const Rr = [
    ['bt-fh6-bldg-b.glb', 16, -2,  -Math.PI/2],
    ['bt-fh6-bldg-c.glb', 16, -17, -Math.PI/2],
    ['bt-fh6-bldg-b.glb', 16, -34, -Math.PI/2],
    ['bt-fh6-bldg-c.glb', 16, -52, -Math.PI/2],
  ];
  for (const [f,x,z,r] of [...L, ...Rr]) jobs.push(place(f, x, 0, z, r));
  // facade-mounted kanban (back face flush on wall, board toward road) — glyph-textured
  const signs = [
    [KANBAN.orange, 8.4, 0.7, -14, 0, 11],
    [KANBAN.red, 8.4, 0.7, -20, 0, 12],
    [KANBAN.green, 9.4, 0.7, -32, 0, 13],
    [KANBAN.magenta, 9.4, 0.7, -4, 0, 14],
    [KANBAN.blue, -9.4, 0.7, -16, Math.PI, 15],
    [KANBAN.orange, -10.4, 0.7, -33, Math.PI, 16],
    [KANBAN.green, 10.2, 0.7, -46, 0, 17],      // extra variety, right row
    [KANBAN.blue, -10.6, 0.7, -46, Math.PI, 18], // extra variety, left row
  ];
  const signObjs = [];
  for (const [f,x,baseY,z,r,seed] of signs)
    signObjs.push(place(f, x, baseY, z, r).then(o=>{ applyKanbanTexture(o, seed); return o; }));
  jobs.push(...signObjs);
  // lamps (arm toward road)
  for (const [x,z] of poolPos)
    jobs.push(place('bt-fh6-lamp.glb', x, 0, z, x>0 ? Math.PI : 0));
  // wet-asphalt reflection streaks under every lamp head
  for (const [x,z] of poolPos){
    const hx = x + (x>0 ? -1.7 : 1.7);
    lampReflection(hx, z);
  }
  // guardrails
  for (const z of [-12,-8,-4,0]) jobs.push(place('bt-fh6-guardrail.glb', -7.8, 0.18, z, Math.PI/2));
  for (const z of [-38,-34,-30,-26,-22]) jobs.push(place('bt-fh6-guardrail.glb', 7.8, 0.18, z, Math.PI/2));
  // trees
  for (const [x,z] of [[-9.6,-6],[-9.6,-18],[-9.6,-30],[9.6,-12],[9.6,-36],[-9.6,-44]])
    jobs.push(place('bt-fh6-tree.glb', x, 0.18, z));
  // utility poles: left run + new right run
  const poleL = [-10,-35,-60], poleR = [-20,-50];
  for (const z of poleL) jobs.push(place('bt-fh6-pole.glb', -10.6, 0, z));
  for (const z of poleR) jobs.push(place('bt-fh6-pole.glb', 10.6, 0, z));
  // NOTE: bt-fh6-wires.glb spans no longer used — its spans ran along X while
  // poles line up along Z, so wires floated unconnected. Catenaries below are
  // built from real pole crossarm attachment points instead.
  const V = (x,y,z)=>new THREE.Vector3(x,y,z);
  for (const [zs, xp] of [[[poleL[0],poleL[1]], -10.6], [[poleL[1],poleL[2]], -10.6], [[poleR[0],poleR[1]], 10.6]]){
    for (const dx of [-0.9, 0.9])
      catenary(V(xp+dx, 8.5, zs[0]), V(xp+dx, 8.5, zs[1]), 1.0);
  }
  // crossing span over the road, lamp-top to lamp-top (real attachment points)
  catenary(V(-8.6, 7.3, -22), V(8.6, 7.3, -30), 1.2);
  catenary(V(-8.6, 7.3, -38), V(8.6, 7.3, -46), 1.2);
  // gantry over road at the intersection + legible blue direction sign
  const gantry = await place('bt-fh6-gantry.glb', 0, 0, -28);
  gantry.traverse(n=>{
    if(n.isMesh && n.name.includes('bluesign')){
      const tex = directionSignTexture();
      n.material = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff,
        emissiveMap: tex, emissiveIntensity: 1.3, roughness: 0.5 });
    }
  });
  // hero van — hide the mis-anchored GLB livery text, add properly parented decals
  const van = await place('bt-fh6-van.glb', 2.6, 0.1, -2, 0);
  van.traverse(n=>{ if(n.isMesh && /livery/i.test(n.name)) n.visible = false; });
  const raku = rakuTexture();
  const decalMat = new THREE.MeshBasicMaterial({ map: raku, transparent:true });
  const rear = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.53), decalMat);
  rear.position.set(0, 1.35, 2.445); van.add(rear);           // rear door, faces camera
  for (const sx of [-1, 1]){
    const side = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 0.7), decalMat);
    side.position.set(sx*1.005, 1.35, 0.3); side.rotation.y = sx*Math.PI/2;
    van.add(side);
  }
  jobs.push(Promise.resolve(van));
  // dark sedan further down
  jobs.push(place('bt-fh6-sedan.glb', 1.6, 0.1, -25, 0));
  // pedestrians
  jobs.push(place('bt-fh6-ped-a.glb', 9.2, 0.02, -22, 2.6));
  jobs.push(place('bt-fh6-ped-c.glb', 9.7, 0.02, -23, -0.6));
  jobs.push(place('bt-fh6-ped-a.glb', 9.0, 0.02, -26, 1.2));
  jobs.push(place('bt-fh6-ped-c.glb', 9.5, 0.02, -27, 3.0));
  jobs.push(place('bt-fh6-ped-b.glb', -9.2, 0.02, -14, 0.8)); // orange jacket figure
  jobs.push(place('bt-fh6-ped-b.glb', -9.4, 0.02, -24, 2.2));
  jobs.push(place('bt-fh6-ped-a.glb', 9.3, 0.02, -33, -1.1));
  // cones + construction barrier on the left sidewalk
  for (const [x,z] of [[-8.2,-6],[-8.6,-8],[-8.0,-10],[-8.4,-12],[-8.3,-16]])
    jobs.push(place('bt-fh6-cone.glb', x, 0.02, z));
  buildBarrier(-9.0, -14.5);
  jobs.push(place('bt-fh6-bicycle.glb', -8.6, 0, -9, Math.PI/2));

  // ground-floor awnings on facades (facade x, center z, span, side)
  const awnCols = [['#c0272d','#f5f2ea'], ['#0e7a6d','#f5f2ea'], ['#1a3fa0','#f5f2ea']];
  let ai = 0;
  for (const [fx, zc, w, side] of [
    [-11,-5,10,1],[-10,-18,11,1],[-11,-33,10,1],[-9,-50,12,1],
    [10,-2,11,-1],[9,-17,12,-1],[10,-34,11,-1],[9,-52,12,-1]]){
    for (const dz of [-w/4, w/4]){
      const [c1,c2] = awnCols[ai++ % awnCols.length];
      const awn = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 1.5),
        new THREE.MeshStandardMaterial({ map: awningTexture(c1,c2), roughness: 0.8, side: THREE.DoubleSide }));
      awn.position.set(fx + side*0.75, 3.55, zc+dz);
      awn.rotation.x = -Math.PI/2 - side*0.42;
      awn.castShadow = true; scene.add(awn);
      // warm strip light under the awning
      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 3.2),
        new THREE.MeshStandardMaterial({ color: 0x201408, emissive: 0xffb45e, emissiveIntensity: 2.0 }));
      strip.position.set(fx + side*0.12, 3.1, zc+dz); scene.add(strip);
    }
  }

  let done = 0; const total = jobs.length;
  for (const j of jobs){ await j; done++; statusEl.textContent = `loading ${done}/${total}`; }
}

function buildBarrier(x, z){
  const g = new THREE.Group();
  const legMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.6, metalness: 0.4 });
  for (const dx of [-0.9, 0.9]){
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.1, 0.5), legMat);
    leg.position.set(dx, 0.55, 0); leg.castShadow = true; g.add(leg);
  }
  const board = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.5),
    new THREE.MeshStandardMaterial({ map: barrierTexture(), emissive: 0xffffff,
      emissiveMap: barrierTexture(), emissiveIntensity: 0.35, roughness: 0.6, side: THREE.DoubleSide }));
  board.position.set(0, 1.0, 0); board.castShadow = true; g.add(board);
  // amber beacon
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0x301800, emissive: 0xff8a00, emissiveIntensity: 3.0 }));
  beacon.position.set(0, 1.38, 0); g.add(beacon);
  g.position.set(x, 0.18, z); g.rotation.y = 0.15;
  scene.add(g);
}

function loop(){
  requestAnimationFrame(loop);
  if (orbit.auto) orbit.theta += 0.003;
  const sp = Math.sin(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius*sp*Math.sin(orbit.theta),
    orbit.target.y + orbit.radius*Math.cos(orbit.phi),
    orbit.target.z + orbit.radius*sp*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
  renderer.render(scene, camera);
}

window.__fh6 = { night:true, ready:false, setNight, streetView, setView, scene, camera,
  state:()=>({ ready:window.__fh6.ready, night:window.__fh6.night,
    objects: scene.children.length,
    cam: camera.position.toArray().map(v=>+v.toFixed(2)) }) };

sizeRenderer();
setNight(true);
streetView();
build().then(()=>{
  window.__fh6.ready = true;
  statusEl.textContent = 'ready — 23 assets · static diorama';
}).catch(err=>{
  statusEl.textContent = 'LOAD ERROR: ' + (err.message||err);
  window.__fh6.error = String(err);
});
loop();
</script>
