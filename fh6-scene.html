<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}

  #view:active{cursor:grabbing}

    text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
  #hud b{font-size:15px;letter-spacing:.5px}
  #bar{position:fixed;top:12px;right:14px;z-index:6;display:flex;gap:8px}
  #bar button{background:rgba(20,24,32,.85);color:#fff;border:1px solid #3a4356;border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer}

<body>
<canvas id="view"></canvas>
<div id="hud"><b>FH6 Night Street — 3D diorama</b><br><span id="sub">static scene · orbit showroom · v2 signage + bloom + wet</span></div>
<div id="bar">
  <button id="btn-day">☀ Day</button>
  <button id="btn-night" class="on">🌙 Night</button>
  <button id="btn-cam">📷 Street view</button>
</div>
<div id="status">loading…</div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const MDIR = './public/models/fh6/';
const statusEl = document.getElementById('status');

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // v2: ACES applied once in the composite pass
renderer.shadowMap.enabled = true;               // dynamic shadows only — nothing baked
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a18);
scene.fog = new THREE.Fog(0x060a18, 60, 190);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);

// ---------- seeded prng ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*f)|0,g=Math.min(255,((n>>8)&255)*f)|0,b=Math.min(255,(n&255)*f)|0;return `rgb(${r},${g},${b})`;}
const CJK_FONT = '"Noto Sans CJK JP","Noto Sans CJK SC","Noto Sans CJK TC",sans-serif';

// ---------- procedural canvas textures (v2: REAL Japanese words only) ----------
// vertical tate-kanban face: characters stacked top-to-bottom (tategaki)
function tatekanbanTexture(word, bg, fg, seed){
  const w=256, h=768;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'), rnd=mulberry32(seed);
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,shade(bg,1.15)); grad.addColorStop(0.5,shade(bg,0.95)); grad.addColorStop(1,shade(bg,0.6));
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  // sheen
  const sheen=g.createLinearGradient(0,0,w,0);
  sheen.addColorStop(0,'rgba(255,255,255,0)'); sheen.addColorStop(0.5,'rgba(255,255,255,0.12)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=sheen; g.fillRect(0,0,w,h);
  // border
  g.strokeStyle=fg; g.lineWidth=10; g.strokeRect(14,14,w-28,h-28);
  g.lineWidth=3; g.strokeRect(30,30,w-60,h-60);
  // vertical word (prolonged-sound mark drawn vertical)
  const chars=[...word.replace(/ー/g,'｜')];
  const n=chars.length;
  const cell=Math.min(150,(h*0.78)/n);
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
  g.font=`900 ${cell*0.84}px ${CJK_FONT}`;
  const y0=h/2-(n-1)*cell/2;
  for(let i=0;i<n;i++) g.fillText(chars[i], w/2, y0+i*cell);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
// horizontal fascia sign face above a shop entrance
function fasciaTexture(word, bg, fg, seed){
  const w=1024, h=168;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'), rnd=mulberry32(seed);
  const grad=g.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,shade(bg,0.85)); grad.addColorStop(0.5,shade(bg,1.1)); grad.addColorStop(1,shade(bg,0.8));
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  g.strokeStyle=fg; g.lineWidth=8; g.strokeRect(10,10,w-20,h-20);
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
  let fs=100;
  const setF=()=>{ g.font=`900 ${fs}px ${CJK_FONT}`; };
  setF();
  while(g.measureText(word).width > w*0.84 && fs>24){ fs-=6; setF(); }
  // slight letterspacing for 2-char words
  g.fillText([...word].join('　').length>3?word:word, w/2, h/2+4);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
// warm shop interior seen through display windows: shelves, bottles, hanging lamps
function interiorTexture(seed){
  const c=document.createElement('canvas'); c.width=512; c.height=288;
  const g=c.getContext('2d'), rnd=mulberry32(seed);
  const grad=g.createLinearGradient(0,0,0,288);
  grad.addColorStop(0,'#6e421c'); grad.addColorStop(0.45,'#a86a2a'); grad.addColorStop(1,'#38200e');
  g.fillStyle=grad; g.fillRect(0,0,512,288);
  const rg=g.createRadialGradient(256,120,10,256,120,260);
  rg.addColorStop(0,'rgba(255,200,120,0.5)'); rg.addColorStop(1,'rgba(255,200,120,0)');
  g.fillStyle=rg; g.fillRect(0,0,512,288);
  for(let s=0;s<3;s++){
    const y=118+s*52;
    g.fillStyle='rgba(30,16,8,0.92)'; g.fillRect(36,y,440,10);
    for(let x=52;x<462;x+=16+rnd()*24){
      if(rnd()<0.72){
        const bh=20+rnd()*28, bw2=9+rnd()*9;
        g.fillStyle=`rgba(${24+rnd()*44|0},${14+rnd()*22|0},8,0.95)`;
        g.fillRect(x, y-bh, bw2, bh);
        g.fillStyle='rgba(255,190,110,0.28)'; g.fillRect(x+2, y-bh, 3, bh);
      }
    }
  }
  for(let i=0;i<3;i++){
    const x=106+i*150;
    g.strokeStyle='rgba(20,10,5,0.9)'; g.lineWidth=4;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,42); g.stroke();
    const lg=g.createRadialGradient(x,56,2,x,56,34);
    lg.addColorStop(0,'rgba(255,230,170,1)'); lg.addColorStop(0.4,'rgba(255,190,110,0.7)'); lg.addColorStop(1,'rgba(255,180,100,0)');
    g.fillStyle=lg; g.beginPath(); g.arc(x,56,34,0,7); g.fill();
    g.fillStyle='#ffe9c0'; g.beginPath(); g.arc(x,56,9,0,7); g.fill();
  }
  g.fillStyle='rgba(24,12,6,0.95)'; g.fillRect(56,238,400,50);
  g.fillStyle='rgba(255,190,110,0.14)'; g.fillRect(56,238,400,6);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function rakuTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=160;
  const g=c.getContext('2d');
  g.clearRect(0,0,512,160);
  g.font='900 92px system-ui, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=10; g.strokeStyle='rgba(0,30,15,0.9)'; g.strokeText('RAKU RAKU',256,84);
  g.fillStyle='#f4fff6'; g.fillText('RAKU RAKU',256,84);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
// gantry direction sign — REAL place names, no glyph rows
function directionSignTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#0d3fa8'; g.fillRect(0,0,512,256);
  g.strokeStyle='#eaf1ff'; g.lineWidth=8; g.strokeRect(10,10,492,236);
  g.fillStyle='#ffffff'; g.textAlign='center'; g.textBaseline='middle';
  g.font=`900 62px ${CJK_FONT}`;
  g.fillText('新宿',120,72); g.fillText('渋谷',120,182);
  g.fillStyle='#ffffff';
  g.fillRect(300,108,104,40);
  g.beginPath(); g.moveTo(404,86); g.lineTo(492,128); g.lineTo(404,170); g.closePath(); g.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
function streakTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=256;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(255,255,255,0.9)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grad; g.fillRect(0,0,64,256);
  const img=g.getImageData(0,0,64,256), d=img.data;
  for(let y=0;y<256;y++) for(let x=0;x<64;x++){
    const f=Math.sin(Math.PI*x/64);
    d[(y*64+x)*4+3]*=f;
  }
  g.putImageData(img,0,0);
  return new THREE.CanvasTexture(c);
}
function awningTexture(c1, c2, seed){
  const c=document.createElement('canvas'); c.width=128; c.height=64;
  const g=c.getContext('2d'), rnd=mulberry32(seed);
  const striped = c1.toLowerCase()!==c2.toLowerCase();
  for(let i=0;i<8;i++){ g.fillStyle=i%2?c1:c2; g.fillRect(i*16,0,16,64); }
  if(!striped){ // solid: subtle cloth shading + seams
    g.fillStyle='rgba(0,0,0,0.10)';
    for(let i=0;i<8;i++) g.fillRect(i*16,0,2,64);
  }
  // scalloped bottom edge shadow
  g.fillStyle='rgba(0,0,0,0.22)'; g.fillRect(0,50,128,14);
  if(striped && rnd()<0.5){ // occasional valance wave
    g.fillStyle='rgba(0,0,0,0.12)';
    for(let x=0;x<128;x+=16) g.fillRect(x,44,16,6);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,1);
  return t;
}
function barrierTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='#e8640a'; g.fillRect(0,0,256,64);
  g.fillStyle='#f5f2ea';
  for(let i=-2;i<10;i++){ g.save(); g.translate(i*40,0); g.rotate(Math.PI/4); g.fillRect(0,-40,20,160); g.restore(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function skyTexture(night){
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,512);
  if(night){
    grad.addColorStop(0,'#020409'); grad.addColorStop(0.45,'#0a1030');
    grad.addColorStop(0.62,'#2a1a3d'); grad.addColorStop(0.70,'#c65a1e');
    grad.addColorStop(0.74,'#3a2030'); grad.addColorStop(1,'#05070c');
  } else {
    grad.addColorStop(0,'#3f7fd0'); grad.addColorStop(0.6,'#9cc6ee');
    grad.addColorStop(0.72,'#e8d9b8'); grad.addColorStop(1,'#b8c4cc');
  }
  g.fillStyle=grad; g.fillRect(0,0,1024,512);
  const rnd=mulberry32(7);
  if(night){
    for(let i=0;i<420;i++){
      const y=rnd()*300, x=rnd()*1024;
      g.fillStyle=`rgba(255,255,255,${0.25+rnd()*0.6})`;
      g.fillRect(x, y, rnd()<0.12?2:1, rnd()<0.12?2:1);
    }
    for(const [hx,col] of [[220,'rgba(255,60,160,0.10)'],[520,'rgba(60,200,255,0.10)'],[820,'rgba(255,120,40,0.12)']]){
      const rg=g.createRadialGradient(hx,360,10,hx,360,180);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=rg; g.fillRect(0,180,1024,220);
    }
  } else {
    g.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<14;i++){ const x=rnd()*1024,y=40+rnd()*180; g.beginPath(); g.ellipse(x,y,40+rnd()*60,12+rnd()*10,0,0,7); g.fill(); }
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function skylineTexture(){
  const c=document.createElement('canvas'); c.width=2048; c.height=256;
  const g=c.getContext('2d'), rnd=mulberry32(99);
  g.clearRect(0,0,2048,256);
  let x=0;
  while(x<2048){
    const bw=40+rnd()*110, bh=60+rnd()*150;
    g.fillStyle='#04060b'; g.fillRect(x,256-bh,bw,bh);
    for(let wy=256-bh+8; wy<248; wy+=12) for(let wx=x+5; wx<x+bw-5; wx+=10){
      if(rnd()<0.35){
        const warm=rnd()<0.6;
        g.fillStyle=warm?`rgba(255,${170+rnd()*40|0},90,0.9)`:`rgba(140,200,255,0.85)`;
        g.fillRect(wx,wy,5,6);
      }
    }
    if(rnd()<0.5){ g.fillStyle='#ff2222'; g.fillRect(x+bw/2-2,256-bh-6,4,4); }
    x+=bw+rnd()*30;
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
// wet-asphalt puddle map: green channel drives roughness (dark = smoother = wetter)
function puddleRoughnessTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), rnd=mulberry32(1234);
  g.fillStyle='#5e5e5e'; g.fillRect(0,0,256,256);           // base ~0.37
  for(let i=0;i<26;i++){
    const x=rnd()*256, y=rnd()*256, r=14+rnd()*46;
    const rg=g.createRadialGradient(x,y,2,x,y,r);
    rg.addColorStop(0,'rgba(26,26,26,0.9)'); rg.addColorStop(0.7,'rgba(38,38,38,0.55)'); rg.addColorStop(1,'rgba(38,38,38,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  for(let i=0;i<500;i++){
    const v=66+rnd()*56|0;
    g.fillStyle=`rgb(${v},${v},${v})`;
    g.fillRect(rnd()*256,rnd()*256,2,2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,10);
  return t;
}

// lights (built once, retuned by day/night)
const hemi=new THREE.HemisphereLight(0x2a3a5f,0x0a0c12,0.55); scene.add(hemi);
const moon=new THREE.DirectionalLight(0x8fb0ff,0.4);
moon.position.set(-25,40,20); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-60; moon.shadow.camera.right=60;
moon.shadow.camera.top=60; moon.shadow.camera.bottom=-60;
moon.shadow.camera.far=160; moon.shadow.bias=-0.0004;
scene.add(moon); scene.add(moon.target); moon.target.position.set(0,0,-30);
const sun=new THREE.DirectionalLight(0xfff2dd,0.0);
sun.position.set(30,50,25); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
sun.shadow.camera.far=180; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0,0,-30);
const pools=[];
const poolPos=[[-8.6,-8],[8.6,-14],[-8.6,-22],[8.6,-30],[-8.6,-38],[8.6,-46],[-8.6,-54]];
for(const [x,z] of poolPos){
  const p=new THREE.PointLight(0xffc37a,0,28,1.6);
  p.position.set(x*0.82,7.2,z); scene.add(p); pools.push(p);
}
const wash=new THREE.PointLight(0x9fd8ff,0,40,1.6);
wash.position.set(0,4,-25); scene.add(wash);
const accentMag=new THREE.PointLight(0xff2a7a,0,22,1.8); accentMag.position.set(7.0,5.0,-12); scene.add(accentMag);
const accentCyn=new THREE.PointLight(0x22ccff,0,22,1.8); accentCyn.position.set(-7.0,5.0,-24); scene.add(accentCyn);

// night-sky dome + distant skyline
const skyMat=new THREE.MeshBasicMaterial({map:skyTexture(true),side:THREE.BackSide,fog:false,depthWrite:false});
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(320,32,20),skyMat);
skyDome.position.set(0,0,-60); scene.add(skyDome);
const daySkyTex=skyTexture(false), nightSkyTex=skyMat.map;
const skylineMat=new THREE.MeshBasicMaterial({map:skylineTexture(),transparent:true,fog:false,depthWrite:false});
const skyline=new THREE.Mesh(new THREE.PlaneGeometry(560,70),skylineMat);
skyline.position.set(0,26,-175); scene.add(skyline);

// ---------- v2 post: custom bloom (UnrealBloom-style, no addons) + ACES composite ----------
// scene -> rtScene (HDR, MSAA) -> bright@1/4 -> blurH -> blurV -> composite(ACES+sRGB) -> canvas
let rtScene=null, rtBright=null, rtBlur=null;
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postScene=new THREE.Scene();
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);
postQuad.frustumCulled=false; postScene.add(postQuad);
const POST_VERT=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const brightMat=new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uThreshold:{value:0.85} },
  vertexShader:POST_VERT,
  fragmentShader:`uniform sampler2D tSrc; uniform float uThreshold; varying vec2 vUv;
    void main(){
      vec3 c=texture2D(tSrc,vUv).rgb;
      float l=dot(c,vec3(0.2126,0.7152,0.0722));
      float w=smoothstep(uThreshold,uThreshold+0.55,l);
      gl_FragColor=vec4(c*w,1.0);
    }`,
  depthTest:false, depthWrite:false,
});
const blurMat=new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uDir:{value:new THREE.Vector2(1,0)}, uRes:{value:new THREE.Vector2(320,200)} },
  vertexShader:POST_VERT,
  fragmentShader:`uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      vec2 px=uDir/uRes;
      vec3 c=texture2D(tSrc,vUv).rgb*0.227027;
      c+=texture2D(tSrc,vUv+px*1.3846).rgb*0.316216;
      c+=texture2D(tSrc,vUv-px*1.3846).rgb*0.316216;
      c+=texture2D(tSrc,vUv+px*3.2308).rgb*0.070270;
      c+=texture2D(tSrc,vUv-px*3.2308).rgb*0.070270;
      gl_FragColor=vec4(c,1.0);
    }`,
  depthTest:false, depthWrite:false,
});
const compMat=new THREE.ShaderMaterial({
  uniforms:{ tScene:{value:null}, tBloom:{value:null}, uStrength:{value:0.55}, uExposure:{value:1.3} },
  vertexShader:POST_VERT,
  fragmentShader:`uniform sampler2D tScene; uniform sampler2D tBloom;
    uniform float uStrength; uniform float uExposure; varying vec2 vUv;
    vec3 aces(vec3 x){
      const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
    }
    vec3 toSRGB(vec3 x){
      return mix(x*12.92,1.055*pow(max(x,vec3(0.0)),vec3(1.0/2.4))-0.055,step(0.0031308,x));
    }
    void main(){
      vec3 col=texture2D(tScene,vUv).rgb+texture2D(tBloom,vUv).rgb*uStrength;
      col=aces(col*uExposure);
      col=toSRGB(col);
      gl_FragColor=vec4(col,1.0);
    }`,
  depthTest:false, depthWrite:false,
});
function sizePostFX(){
  const w=Math.max(2,Math.floor(canvas.width)), h=Math.max(2,Math.floor(canvas.height));
  const bw=Math.max(2,w>>2), bh=Math.max(2,h>>2);
  if(rtScene){ rtScene.setSize(w,h); rtBright.setSize(bw,bh); rtBlur.setSize(bw,bh); }
  else{
    rtScene=new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,samples:4});
    rtBright=new THREE.WebGLRenderTarget(bw,bh,{type:THREE.HalfFloatType});
    rtBlur=new THREE.WebGLRenderTarget(bw,bh,{type:THREE.HalfFloatType});
  }
  blurMat.uniforms.uRes.value.set(bw,bh);
}

// wet-road env reflections (captured once per mode from the real scene)
let roadMat=null, envNightTex=null, envDayTex=null;
function applyWetRoad(night){
  if(!roadMat) return;
  roadMat.envMap=night?envNightTex:envDayTex;
  roadMat.envMapIntensity=night?0.55:0.30;
  roadMat.needsUpdate=true;

const loader=new GLTFLoader();
const cache=new Map();
const EMISSIVE_INTENSITY_MULTIPLIER=1.0;
function loadGLB(file){
  if(cache.has(file)) return cache.get(file);
  const p=new Promise((res,rej)=>loader.load(MDIR+file,gltf=>{
    gltf.scene.traverse(n=>{
      if(!n.isMesh) return;
      const materials=Array.isArray(n.material)?n.material:[n.material];
      materials.forEach(m=>{if(m&&'emissiveIntensity' in m) m.emissiveIntensity*=EMISSIVE_INTENSITY_MULTIPLIER;});
    });
    res(gltf);
  },undefined,rej));
  cache.set(file,p); return p;
}
async function place(file,x,y,z,rotY=0){
  const gltf=await loadGLB(file);
  const o=gltf.scene.clone(true);
  o.position.set(x,y,z); o.rotation.y=rotY;
  o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
  scene.add(o); return o;
}

const wireMat=new THREE.MeshBasicMaterial({color:0x050507});
function catenary(a,b,sag,radius=0.025){
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5); mid.y-=sag;
  const curve=new THREE.QuadraticBezierCurve3(a,mid,b);
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,20,radius,6),wireMat);
  scene.add(mesh); return mesh;
}

const streakTex=streakTexture();
// wet-pavement light streak: ONLY ever created directly beneath a visible source
function groundStreak(x,z,tint,len=6,w=1.2,op=0.16,y=0.13){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,len),
    new THREE.MeshBasicMaterial({map:streakTex,color:tint,transparent:true,opacity:op,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z);
  m.material.userData.baseOp=op; streakMats.push(m.material);
  m.renderOrder=2; scene.add(m); return m;
}

async function build(){
  const jobs=[];
  // ground + markings — asphalt gets the wet treatment
  const ground=await place('bt-fh6-ground.glb',0,0,-30);
  ground.traverse(n=>{
    if(n.isMesh&&n.material&&/asphalt/.test(n.material.name)){
      roadMat=n.material;
      roadMat.color.multiplyScalar(0.82);          // damp darkening
      roadMat.roughness=1.0;                       // driven by puddle map
      roadMat.roughnessMap=puddleRoughnessTexture();
      roadMat.metalness=0.0;
    }
  });
  jobs.push(place('bt-fh6-markings.glb',0,0,-30));
  // buildings + per-building shop rows (3 shops each, both sides of the street)
  // facadeX = road-facing wall plane x; fw = frontage along z
  const BUILDINGS=[
    {f:'bt-fh6-bldg-a.glb',bx:-16,bz:-5, rot:Math.PI/2, fx:-11.0,fw:10,side:1},
    {f:'bt-fh6-bldg-b.glb',bx:-16,bz:-18,rot:Math.PI/2, fx:-10.0,fw:11,side:1},
    {f:'bt-fh6-bldg-a.glb',bx:-16,bz:-33,rot:Math.PI/2, fx:-11.0,fw:10,side:1},
    {f:'bt-fh6-bldg-c.glb',bx:-16,bz:-50,rot:Math.PI/2, fx:-9.0, fw:12,side:1},
    {f:'bt-fh6-bldg-b.glb',bx:16, bz:-2, rot:-Math.PI/2,fx:10.0, fw:11,side:-1},
    {f:'bt-fh6-bldg-c.glb',bx:16, bz:-17,rot:-Math.PI/2,fx:9.0,  fw:12,side:-1},
    {f:'bt-fh6-bldg-b.glb',bx:16, bz:-34,rot:-Math.PI/2,fx:10.0, fw:11,side:-1},
    {f:'bt-fh6-bldg-c.glb',bx:16, bz:-52,rot:-Math.PI/2,fx:9.0,  fw:12,side:-1},
  ];
  for(const b of BUILDINGS) jobs.push(place(b.f,b.bx,0,b.bz,b.rot));
  const shops=[];
  let wi=0;
  for(let bi=0;bi<BUILDINGS.length;bi++){
    const b=BUILDINGS[bi], nb=3, bw=b.fw/nb;
    for(let si=0;si<nb;si++){
      const [word,bg,fg]=SHOP_WORDS[wi%SHOP_WORDS.length]; wi++;
      const shopZ=b.bz-b.fw/2+bw*(si+0.5);
      shops.push(buildShop(bi,si,word,bg,fg,b.side,b.fx,shopZ,bw,1000+bi*37+si*11));
    }
  }
  // obstacles for the kanban nudge pass (world x,z,r)
  for(const [x,z] of poolPos) obstacles.push({x,z,r:0.9});
  for(const [x,z] of [[-9.6,-6],[-9.6,-18],[-9.6,-30],[9.6,-12],[9.6,-36],[-9.6,-44]]) obstacles.push({x,z,r:1.2});
  for(const z of [-10,-35,-60]) obstacles.push({x:-10.6,z,r:0.8});
  for(const z of [-20,-50]) obstacles.push({x:10.6,z,r:0.8});
  scene.updateMatrixWorld(true);
  // kanban nudge: shift along the street until clear of lamps/trees/poles; then
  // add its wet-pavement streak directly beneath it (traces to the visible sign)
  for(const s of shops){
    let shift=0;
    for(let attempt=0;attempt<3;attempt++){
      const v=new THREE.Vector3(s.bw/2+shift,0,1.15).applyMatrix4(s.group.matrixWorld);
      let clash=false;
      for(const o of obstacles){
        const dx=v.x-o.x,dz=v.z-o.z;
        if(dx*dx+dz*dz<(o.r+0.75)*(o.r+0.75)){clash=true;break;}
      }
      if(!clash) break;
      shift+=1.35;
    }
    s.kanban.position.x=s.bw/2+shift;
    s.group.updateMatrixWorld(true);
    const wp=new THREE.Vector3(0,0,1.55);
    s.kanban.localToWorld(wp);
    groundStreak(wp.x,wp.z,new THREE.Color(s.bg),5.5,1.15,0.15,0.24);
  }
  // small upper-floor signs (1F-3F band only), flat-mounted on two rails
  for(let bi=0;bi<BUILDINGS.length;bi++){
    const b=BUILDINGS[bi];
    const [word,bg,fg]=UPPER_SIGNS[bi%UPPER_SIGNS.length];
    const tex=fasciaTexture(word,bg,fg,5000+bi);

  for(const [x,z] of poolPos)
    jobs.push(place('bt-fh6-lamp.glb',x,0,z,x>0?Math.PI:0));
  for(const [x,z] of poolPos){

  // guardrails
  for(const z of [-12,-8,-4,0]) jobs.push(place('bt-fh6-guardrail.glb',-7.8,0.18,z,Math.PI/2));
  for(const z of [-38,-34,-30,-26,-22]) jobs.push(place('bt-fh6-guardrail.glb',7.8,0.18,z,Math.PI/2));
  // trees
  for(const [x,z] of [[-9.6,-6],[-9.6,-18],[-9.6,-30],[9.6,-12],[9.6,-36],[-9.6,-44]])
    jobs.push(place('bt-fh6-tree.glb',x,0.18,z));
  // utility poles: left run + right run
  const poleL=[-10,-35,-60], poleR=[-20,-50];
  for(const z of poleL) jobs.push(place('bt-fh6-pole.glb',-10.6,0,z));
  for(const z of poleR) jobs.push(place('bt-fh6-pole.glb',10.6,0,z));
  // NOTE: bt-fh6-wires.glb retired — spans ran along X while poles line up along Z.
  // Catenaries below are built from real pole crossarm attachment points instead.
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  for(const [zs,xp] of [[[poleL[0],poleL[1]],-10.6],[[poleL[1],poleL[2]],-10.6],[[poleR[0],poleR[1]],10.6]]){
    for(const dx of [-0.9,0.9])
      catenary(V(xp+dx,8.5,zs[0]),V(xp+dx,8.5,zs[1]),1.0);
  }
  // crossing spans over the road, lamp-top to lamp-top (real attachment points)
  catenary(V(-8.6,7.3,-22),V(8.6,7.3,-30),1.2);
  catenary(V(-8.6,7.3,-38),V(8.6,7.3,-46),1.2);
  // gantry over road at the intersection + real-word direction sign
  const gantry=await place('bt-fh6-gantry.glb',0,0,-28);
  gantry.traverse(n=>{
    if(n.isMesh&&n.name.includes('bluesign')){
      const tex=directionSignTexture();
      n.material=new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,
        emissiveMap:tex,emissiveIntensity:1.3,roughness:0.5});
    }
  });
  groundStreak(2.5,-28,0x9fc4ff,7,1.6,0.20,0.135);   // under the gantry direction sign
  // hero van — hide the mis-anchored GLB livery text, add properly parented decals
  const van=await place('bt-fh6-van.glb',2.6,0.1,-2,0);
  van.traverse(n=>{if(n.isMesh&&/livery/i.test(n.name)) n.visible=false;});
  const raku=rakuTexture();
  const decalMat=new THREE.MeshBasicMaterial({map:raku,transparent:true});
  const rear=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.344),decalMat);
  rear.position.set(0,1.35,2.445); van.add(rear);           // rear door, faces camera (1.1 m wide: fits between taillight blocks)
  for(const sx of [-1,1]){
    const sidel=new THREE.Mesh(new THREE.PlaneGeometry(2.8,0.7),decalMat);
    sidel.position.set(sx*1.005,1.35,0.3); sidel.rotation.y=sx*Math.PI/2;
    van.add(sidel);
  }
  jobs.push(Promise.resolve(van));
  // dark sedan further down
  jobs.push(place('bt-fh6-sedan.glb',1.6,0.1,-25,0));
  // pedestrians
  jobs.push(place('bt-fh6-ped-a.glb',9.2,0.02,-22,2.6));
  jobs.push(place('bt-fh6-ped-c.glb',9.7,0.02,-23,-0.6));
  jobs.push(place('bt-fh6-ped-a.glb',9.0,0.02,-26,1.2));
  jobs.push(place('bt-fh6-ped-c.glb',9.5,0.02,-27,3.0));
  jobs.push(place('bt-fh6-ped-b.glb',-9.2,0.02,-14,0.8));
  jobs.push(place('bt-fh6-ped-b.glb',-9.4,0.02,-24,2.2));
  jobs.push(place('bt-fh6-ped-a.glb',9.3,0.02,-33,-1.1));
  // cones + construction barrier on the left sidewalk
  for(const [x,z] of [[-8.2,-6],[-8.6,-8],[-8.0,-10],[-8.4,-12],[-8.3,-16]])
    jobs.push(place('bt-fh6-cone.glb',x,0.02,z));
  buildBarrier(-9.0,-14.5);
  jobs.push(place('bt-fh6-bicycle.glb',-8.6,0,-9,Math.PI/2));

  let done=0; const total=jobs.length;
  for(const j of jobs){ await j; done++; statusEl.textContent=`loading ${done}/${total}`; }
}

function buildBarrier(x,z){
  const g=new THREE.Group();
  const legMat=new THREE.MeshStandardMaterial({color:0x2a2a2e,roughness:0.6,metalness:0.4});
  for(const dx of [-0.9,0.9]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.1,0.5),legMat);
    leg.position.set(dx,0.55,0); leg.castShadow=true; g.add(leg);
  }
  const board=new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.5),
    new THREE.MeshStandardMaterial({map:barrierTexture(),emissive:0xffffff,
      emissiveMap:barrierTexture(),emissiveIntensity:0.35,roughness:0.6,side:THREE.DoubleSide}));
  board.position.set(0,1.0,0); board.castShadow=true; g.add(board);
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),
    new THREE.MeshStandardMaterial({color:0x301800,emissive:0xff8a00,emissiveIntensity:3.0}));
  beacon.position.set(0,1.38,0); g.add(beacon);
  g.position.set(x,0.18,z); g.rotation.y=0.15;
  scene.add(g);
}

// capture the real scene into cube env maps (night + day) for wet-asphalt reflections
// shadow-casting lights are parked during capture: 12 cube-face renders stay cheap
async function captureWetEnv(){
  if(!roadMat) return;
  const mc=moon.castShadow, sc=sun.castShadow;
  moon.castShadow=false; sun.castShadow=false;
  try{
    const mk=()=>{
      const rt=new THREE.WebGLCubeRenderTarget(128,{type:THREE.HalfFloatType,
        generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter});
      const cam=new THREE.CubeCamera(0.6,320,rt);
      cam.position.set(0,4.0,-25); scene.add(cam);
      return [rt,cam];
    };
    const [rtN,camN]=mk(), [rtD,camD]=mk();
    setNight(true);  camN.update(renderer,scene); envNightTex=rtN.texture;
    setNight(false); camD.update(renderer,scene); envDayTex=rtD.texture;
    setNight(true);
    scene.remove(camN); scene.remove(camD);
    applyWetRoad(true);
    window.__fh6.env=true;
  }catch(e){ console.warn('wet env capture failed:',e); window.__fh6.env=false; }
  moon.castShadow=mc; sun.castShadow=sc;
}

const SINGLE_FRAME=new URLSearchParams(location.search).has('frame'); // ?frame=1: static capture mode
// mobile: static diorama renders on demand only (orbit / day-night / resize)
// instead of burning GPU every frame; auto-orbit forces continuous frames.
let needsRender=true;
const markDirty=()=>{needsRender=true;};
function renderFrame(){
  const sp=Math.sin(orbit.phi);
  camera.position.set(
    orbit.target.x+orbit.radius*sp*Math.sin(orbit.theta),
    orbit.target.y+orbit.radius*Math.cos(orbit.phi),
    orbit.target.z+orbit.radius*sp*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
  // v2 post chain: scene(HDR+MSAA) -> bright -> blurH -> blurV -> composite(ACES+sRGB)
  renderer.setRenderTarget(rtScene);
  renderer.render(scene,camera);
  brightMat.uniforms.tSrc.value=rtScene.texture;
  postQuad.material=brightMat;
  renderer.setRenderTarget(rtBright);
  renderer.render(postScene,postCam);
  blurMat.uniforms.tSrc.value=rtBright.texture;
  blurMat.uniforms.uDir.value.set(1,0);
  postQuad.material=blurMat;
  renderer.setRenderTarget(rtBlur);
  renderer.render(postScene,postCam);
  blurMat.uniforms.tSrc.value=rtBlur.texture;
  blurMat.uniforms.uDir.value.set(0,1);
  renderer.setRenderTarget(rtBright);
  renderer.render(postScene,postCam);
  compMat.uniforms.tScene.value=rtScene.texture;
  compMat.uniforms.tBloom.value=rtBright.texture;
  postQuad.material=compMat;
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
}

function loop(){
  requestAnimationFrame(loop);
  if(orbit.auto){orbit.theta+=0.003;needsRender=true;}
  if(!needsRender) return;
  needsRender=false;
  renderFrame();
}

window.__fh6={night:true,ready:false,env:false,setNight,streetView,setView,scene,camera,
  renderOnce:()=>renderFrame(),
  state:()=>({ready:window.__fh6.ready,night:window.__fh6.night,env:window.__fh6.env,
    objects:scene.children.length,
    cam:camera.position.toArray().map(v=>+v.toFixed(2))})};

sizeRenderer();
setNight(true);
streetView();
build().then(async ()=>{
  await captureWetEnv();
  window.__fh6.ready=true;
  statusEl.textContent='ready — FH6 v2 · 24 shops · bloom + wet asphalt';
  markDirty();   // final composed frame (on-demand render mode)
}).catch(err=>{
  statusEl.textContent='LOAD ERROR: '+(err.message||err);
  window.__fh6.error=String(err);
});
loop();
</script>
