<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tokyo Drift — Web Rebuild</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#050510;overflow:hidden;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050510}
  #game{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  .hud{position:fixed;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;z-index:5}
  #topbar{top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-size:15px;font-weight:700;text-shadow:0 2px 4px #000}
  #topbar .dim{opacity:.75;font-weight:400}
  #nitrobar{bottom:calc(96px + env(safe-area-inset-bottom));left:14px;width:120px;height:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:5px;overflow:hidden}
  #nitrofill{height:100%;width:0%;background:linear-gradient(90deg,#53B5F9,#9fe0ff)}
  #hearts{bottom:calc(112px + env(safe-area-inset-bottom));left:14px;font-size:18px;letter-spacing:2px;text-shadow:0 2px 4px #000}
  #msg{top:34%;left:0;right:0;text-align:center;font-size:64px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 18px #000;display:none}
  #submsg{top:calc(34% + 84px);left:0;right:0;text-align:center;font-size:20px;font-weight:700;text-shadow:0 2px 8px #000;display:none}
  #banner{top:calc(60px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:26px;font-weight:900;letter-spacing:8px;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .4s}
  #nitrobtn{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9fe0ff,#1e6fd9 70%);border:3px solid rgba(255,255,255,.7);
    color:#fff;font-family:inherit;font-weight:900;font-size:14px;z-index:6;display:none;touch-action:none;opacity:.45}
  #nitrobtn:active{transform:scale(.93)}
  #nitrobtn.ready{opacity:1;box-shadow:0 0 22px rgba(74,226,255,.9);animation:nitropulse 0.9s infinite alternate}
  @keyframes nitropulse{from{box-shadow:0 0 12px rgba(74,226,255,.5)}to{box-shadow:0 0 30px rgba(74,226,255,1)}}
  #devbtn, #scenebtn{pointer-events:auto;cursor:pointer;margin-top:14px;font-size:13px;font-weight:700;letter-spacing:2px;
    padding:10px 26px;border:2px solid rgba(74,226,255,.6);border-radius:10px;color:#4ae2ff;background:rgba(74,226,255,.08)}
  #devlog{justify-content:flex-start;padding:18px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #devlog .dhead{font-size:22px;letter-spacing:4px;color:#4ae2ff;margin:6px 0 2px;font-weight:900}
  #devlog .dsub{font-size:11px;opacity:.6;margin-bottom:8px}
  .dentry{text-align:left;width:100%;max-width:560px;border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.04)}
  .dentry .dv{font-size:13px;font-weight:900;color:#ffdd46;letter-spacing:1px}
  .dentry .dt{font-size:12px;font-weight:700;color:#fff;margin:4px 0}
  .dentry .dsec{font-size:10px;letter-spacing:2px;color:#4ae2ff;margin:8px 0 3px}
  .dentry ul{margin:2px 0;padding-left:16px;font-size:11px;line-height:1.5;color:#dfe3ee}
  .dentry .dshots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .dentry figure{margin:0;width:31%}
  .dentry img{width:100%;border-radius:6px;border:1px solid rgba(255,255,255,.2);display:block}
  .dentry figcaption{font-size:9px;opacity:.65;margin-top:2px;line-height:1.3}
  #devclose{pointer-events:auto;cursor:pointer;margin:14px 0 26px;font-size:15px;font-weight:900;letter-spacing:3px;
    padding:12px 40px;border:none;border-radius:10px;color:#fff;background:#1e6fd9}
  .overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,5,16,.82);backdrop-filter:blur(3px);font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;text-align:center;padding:20px}
  .overlay h1{font-size:42px;letter-spacing:6px;margin:0 0 6px;color:#ff2a5a;text-shadow:0 0 24px rgba(255,42,90,.6)}
  .overlay h2{font-size:15px;letter-spacing:3px;opacity:.7;margin:0 0 22px;font-weight:400}
  .sect{font-size:12px;letter-spacing:3px;opacity:.6;margin:16px 0 8px}
  .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px}
  .opt{pointer-events:auto;cursor:pointer;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.06)}
  .opt.sel{border-color:#ff2a5a;background:rgba(255,42,90,.18);box-shadow:0 0 14px rgba(255,42,90,.35)}
  .opt small{display:block;font-weight:400;opacity:.65;font-size:11px;margin-top:3px}
  #startbtn{pointer-events:auto;cursor:pointer;margin-top:26px;font-size:20px;font-weight:900;letter-spacing:4px;
    padding:16px 54px;border:none;border-radius:14px;color:#fff;background:linear-gradient(180deg,#ff2a5a,#b3123a);
    box-shadow:0 6px 30px rgba(255,42,90,.5)}
  #startbtn:active{transform:scale(.96)}
  #finishstats{font-size:16px;line-height:2;margin:10px 0 0}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="overlay" id="title">
  <h1>TOKYO DRIFT</h1>
  <h2>NEON CITY &bull; 2 LAPS</h2>
  <div class="sect">MACHINE</div>
  <div class="opts" id="caropts"></div>
  <div class="sect">TRACK</div>
  <div class="opts" id="trackopts"></div>
  <button id="startbtn">START RACE</button>
  <button id="scenebtn" style="margin-top:10px" onclick="location.href='districts.html'">SCENES &#x1F3D9;&#xFE0F;</button>
  <button id="devbtn" style="margin-top:10px">DEV LOG</button>
  <div class="sect" style="margin-top:18px">STEER: HOLD LEFT / RIGHT HALF OF SCREEN</div>
</div>
<div class="overlay hidden" id="devlog"></div>

<div class="overlay hidden" id="finish">
  <h1 id="finishpos">1ST</h1>
  <h2>RACE FINISHED</h2>
  <div id="finishstats"></div>
  <button id="startbtn2" class="opt" style="pointer-events:auto;margin-top:26px;font-size:18px;padding:14px 44px;border:none">RACE AGAIN</button>
</div>

<div class="overlay hidden" id="gameover">
  <h1>WRECKED</h1>
  <h2>OUT OF HEARTS</h2>
  <div id="gostats" style="font-size:16px;line-height:2;margin:10px 0 0"></div>
  <button id="startbtn3" class="opt" style="pointer-events:auto;margin-top:26px;font-size:18px;padding:14px 44px;border:none">RETRY</button>
</div>

<button id="nitrobtn">NITRO</button>

<script src="assets/changelog-data.js"></script>
<script src="assets/game.js"></script>
</body>
</html>
