<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Tokyo Drift 3D — Neon Night (M2)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070f; touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; }
  #game canvas { display:block; width:100%; height:100%; }
  /* Full-screen steering zone: left half = steer left, right half = steer right */
  #touchzone { position:fixed; inset:0; z-index:5; touch-action:none; }
  .hud { position:fixed; z-index:10; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #topbar { top:calc(10px + env(safe-area-inset-top)); left:0; right:0; display:flex;
    justify-content:center; gap:26px; font-size:15px; font-weight:600; letter-spacing:.06em; }
  #topbar .lbl { display:block; font-size:10px; font-weight:400; opacity:.65; letter-spacing:.18em; text-align:center;}
  #speedo { bottom:calc(118px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; }
  #speedo .v { font-size:56px; font-weight:800; line-height:1; }
  #speedo .u { font-size:13px; opacity:.7; letter-spacing:.2em; }
  /* Nitro meter */
  #nitro-meter { position:fixed; z-index:10; pointer-events:none;
    bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    width:150px; height:8px; border-radius:4px; background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25); overflow:hidden; }
  #nitro-fill { height:100%; width:100%; border-radius:4px;
    background:linear-gradient(90deg,#35f2ff,#7dff9e); transition:width .08s linear; }
  #nitro-fill.burn { background:linear-gradient(90deg,#ff9f43,#ff5fa2); }
  #nitro-lbl { position:fixed; z-index:10; pointer-events:none;
    bottom:calc(106px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
    font-size:9px; letter-spacing:.28em; opacity:.6; }
  /* Nitro button, bottom-right */
  #btn-nitro { position:fixed; z-index:20; right:18px; bottom:calc(18px + env(safe-area-inset-bottom));
    width:92px; height:92px; border-radius:50%; border:2px solid rgba(53,242,255,.55);
    background:rgba(10,30,40,.62); color:#35f2ff; font-size:13px; font-weight:800;
    letter-spacing:.08em; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px); touch-action:none; text-shadow:0 0 12px rgba(53,242,255,.8); }
  #btn-nitro.on { background:rgba(53,242,255,.45); color:#04121a; }
  #overlay { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:rgba(4,6,12,.72); backdrop-filter:blur(3px); }
  #overlay h1 { font-size:30px; letter-spacing:.12em; font-weight:800;
    background:linear-gradient(90deg,#ff5fa2,#7df9ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #overlay p { font-size:13px; opacity:.75; text-align:center; padding:0 24px; line-height:1.7; }
  #overlay .tap { margin-top:10px; padding:14px 42px; border-radius:999px; font-size:17px; font-weight:800;
    letter-spacing:.1em; color:#04120a; background:#7dff9e; border:none; }
  #err { position:fixed; z-index:99; left:8px; bottom:8px; max-width:90vw; font-size:10px; color:#ff8080;
    background:rgba(0,0,0,.7); padding:6px 8px; border-radius:6px; display:none; white-space:pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "rapier": "./vendor/rapier.es.js"
} }
</script>
</head>
<body>
<div id="game"></div>
<div id="touchzone"></div>

<div class="hud" id="topbar">
  <div><span class="lbl">TIME</span><span id="hud-time">00:00</span></div>
  <div><span class="lbl">DIST</span><span id="hud-dist">0.00 km</span></div>
</div>
<div class="hud" id="speedo"><div class="v" id="hud-speed">0</div><div class="u">KM/H</div></div>
<div id="nitro-lbl">NITRO</div>
<div id="nitro-meter"><div id="nitro-fill"></div></div>

<div id="btn-nitro">NITRO</div>

<div id="overlay">
  <h1>TOKYO DRIFT 3D</h1>
  <p>NEON NIGHT &mdash; Milestone 2</p>
  <p>Hold LEFT / RIGHT half of the screen to steer &mdash; the car accelerates on its own.<br>
  Hold NITRO (or Space) for 270 km/h boost.<br>
  Keyboard: &#9664; &#9654; / A D to steer, Space / Shift for nitro.</p>
  <button class="tap" id="btn-start">TAP TO START</button>
</div>
<div id="err"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
